ashoffset:-40}}\n.connection-list{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px}.connection-list h3{margin:0 0 11px;font-size:18px}.connection-list p{font-size:14px;line-height:1.8;color:var(--muted)}.conn-item{padding:12px 0;border-bottom:1px solid #dfe5e9}.conn-item:last-child{border-bottom:0}.conn-item button{display:block;background:transparent;border:0;text-align:left;color:#263842;width:100%;font:13px var(--mono);line-height:1.7}.conn-item button:hover{color:var(--accent)}.conn-item small{display:block;color:var(--muted);font:13px/1.7 var(--sans)}\n.theory-section{margin:52px 0}.theory-section h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.035em;margin:0 0 12px}.theory-section>p{max-width:950px;font-size:17px;line-height:1.9;color:#40525c}\n.concept-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.concept-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.concept-card .concept-num{color:var(--accent);font:13px var(--mono);margin-bottom:10px}.concept-card h3{font-size:19px;margin:0 0 9px}.concept-card p{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 11px}.concept-card .example{padding:12px;border-radius:9px;background:#f2f6e9;color:#3d5423;font-size:14px;line-height:1.8}\n.packet-anatomy{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.packet-anatomy div{min-height:93px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.packet-anatomy b{font-size:14px;display:block;margin-bottom:6px}.packet-anatomy span{font-size:13px;line-height:1.6;color:var(--muted)}\n.flow-demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch;margin:18px 0}.flow-demo .flowbox{padding:17px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}.flow-demo .flowbox b{font-size:16px;display:block}.flow-demo .flowbox span{font-size:14px;color:var(--muted);line-height:1.7;display:block;margin-top:5px}.flow-arrow{color:var(--accent);font-size:25px;align-self:center;text-align:center}\n.traffic-sim{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:22px 0}.traffic-sim h3{font-size:22px;margin:0 0 8px}.traffic-sim>p{font-size:15px;line-height:1.8;color:var(--muted)}.traffic-mode-row{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.traffic-metric{display:grid;grid-template-columns:130px minmax(0,1fr) 95px;gap:12px;align-items:center;margin:13px 0;font-size:14px}.traffic-track{height:18px;background:#e7ecef;border-radius:99px;overflow:hidden}.traffic-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a3d359,#6f9d20);transition:width .9s cubic-bezier(.2,.8,.2,1)}.traffic-fill.warn{background:linear-gradient(90deg,#f6c36d,#c25d45)}.traffic-metric strong{font:13px var(--mono);text-align:right}.traffic-outcome{padding:15px;border-radius:10px;background:#f1f6e6;border:1px solid #d3e4b6;color:#435c25;font-size:15px;line-height:1.8;margin-top:16px}.traffic-sources{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.traffic-source{border:1px solid #e5b6a4;background:#fff3ed;color:#8d442f;border-radius:7px;padding:8px 10px;font:12px var(--mono);animation:sourcePulse 1.4s ease-in-out infinite alternate}@keyframes sourcePulse{to{transform:translateY(-3px);box-shadow:0 6px 16px #b75a3b1e}}\n.definition-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.definition-table th,.definition-table td{padding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1 ><div class=\"hero-panel reveal\"><div class=\"panel-top\"><div><div class=\"panel-title\">SOC SHIFT OVERVIEW</div><div class=\"mini-label\">Синтетическая телеметрия · демонстрация</div></div><span class=\"pill accent\">TRAINING</span></div><div class=\"threat-metric\"><div><div class=\"mini-label\">Событий обработано</div><strong>24,891</strong></div><span>↗ учебный поток</span></div><svg class=\"spark\" viewBox=\"0 0 440 78\" preserveAspectRatio=\"none\"><defs><linearGradient id=\"area\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#c6f36a\" stop-opacity=\".3\"/><stop offset=\"100%\" stop-color=\"#c6f36a\" stop-opacity=\"0\"/></linearGradient></defs><path d=\"M0 55 L20 49 L39 54 L58 35 L78 43 L98 30 L117 39 L137 15 L156 28 L176 20 L196 45 L215 34 L235 40 L254 19 L274 29 L294 11 L313 24 L333 18 L352 43 L372 34 L391 47 L411 25 L440 16 L440 78 L0 78Z\" fill=\"url(#area)\"/><path d=\"M0 55 L20 49 L39 54 L58 35 L78 43 L98 30 L117 39 L137 15 L156 28 L176 20 L196 45 L215 34 L235 40 L254 19 L274 29 L294 11 L313 24 L333 18 L352 43 L372 34 L391 47 L411 25 L440 16\" stroke=\"#c6f36a\" stroke-width=\"1.7\" fill=\"none\"/></svg><div class=\"event-line\"><span class=\"event-icon\">⌁</span><div class=\"event-copy\"><b>Repeated authentication failures</b><span>auth-gateway-02 · user: svc-backup</span></div><span class=\"severity\">HIGH</span></div><div class=\"event-line\"><span class=\"event-icon\">◉</span><div class=\"event-copy\"><b>Unusual DNS query pattern</b><span>workstation-17 · DNS telemetry</span></div><span class=\"severity medium\">MEDIUM</span></div><div class=\"event-line\"><span class=\"event-icon\">◇</span><div class=\"event-copy\"><b>New scheduled task observed</b><span>endpoint logs · needs context</span></div><span class=\"severity low\">LOW</span></div></div></section><section style=\"padding-bottom:35px\"><div class=\"stats-row reveal\"><div class=\"stat\"><div class=\"stat-value\">09</div><div class=\"stat-label\">Учебных этапов</div><div class=\"stat-note\">ОТ СЕТЕЙ ДО ПОРТФОЛИО</div></div><div class=\"stat\"><div class=\"stat-value\">06</div><div class=\"stat-label\">Интерактивных приложений</div><div class=\"stat-note\">СИМУЛЯТОРЫ ДЛЯ ПРАКТИКИ</div></div><div class=\"stat\"><div class=\"stat-value\" data-progress-percent>0%</div><div class=\"stat-label\">Отмеченный прогресс</div><div class=\"stat-note\">ХРАНИТСЯ В БРАУЗЕРЕ</div></div><div class=\"stat\"><div class=\"stat-value\">L1 →</div><div class=\"stat-label\">Цель маршрута</div><div class=\"stat-note\">JUNIOR SOC ANALYST</div></div></div></section><section class=\"section\"><div class=\"section-head\"><div><div class=\"eyebrow\">Панель навигации</div><h2>Выбери следующее действие</h2><p>Маршрут построен по зависимостям: сперва базы, затем инструменты, затем расследования и подготовка к работе.</p></div><span class=\"section-index\">01 / YOUR WORKSPACE</span></div><div class=\"grid\"><a class=\"card reveal\" href=\"roadmap.html\"><div class=\"card-icon\">⌘</div><span class=\"pill accent\">START HERE</span><h3>Карта навыков</h3><p>Девять этапов, темы, практика, критерии готовности и полезные материалы.</p><div class=\"card-foot\"><span>План обучения</span><span class=\"arrow\">↗</span></div></a><a class=\"card reveal\" href=\"academy.html\"><div class=\"card-icon\">▤</div><h3>Учебный центр</h3><p>Триаж, evidence, severity, эскалация и документация.</p><div class=\"card-foot\"><span>Ключевые понятия</span><span class=\"arrow\">↗</span></div></a><a class=\"card reveal\" href=\"tools.html\"><div class=\"card-icon\">◫</div><h3>Инструментарий</h3><p>Wireshark-подобный Packet Explorer, SIEM, endpoint, phishing и detection demos.</p><div class=\"card-foot\"><span>Инструменты</span><span class=\"arrow\">↗</span></div></a><a class=\"card reveal\" href=\"lab-wireshark.html\"><div class=\"card-icon\">⌁</div><span class=\"pill blue\">INTERACTIVE</span><h3>Packet Explorer</h3><p>Фильтры, список пакетов и раскрываемые уровни протоколов.</p><div class=\"card-foot\"><span>Сетевой анализ</span><span class=\"arrow\">↗</span></div></a><a class=\"card reveal\" href=\"siem.html\"><div class=\"card-icon\">▦</div><span class=\"pill blue\">INTERACTIVE</span><h3>Mini SIEM</h3><p>Поиск по синтетическим событиям, контекст и классификация.</p><div class=\"card-foot\"><span>Логи и корреляция</span><span class=\"arrow\">↗</span></div></a><a class=\"card reveal\" href=\"cases.html\"><div class=\"card-icon\">◎</div><h3>Комната кейсов</h3><p>Таймлайн, доказательства, решение и передача старшему аналитику.</p><div class=\"card-foot\"><span>Расследование</span><span class=\"arrow\">↗</span></div></a></div></section><section class=\"section\" style=\"padding-top:0\"><div class=\"feature-band reveal\"><div><div class=\"eyebrow\">Мышление аналитика</div><h2>Каждый вывод должен опираться на доказательство.</h2><p>Не прыгай от «подозрительно» сразу к «компрометация подтверждена». Сформулируй гипотезу, найди телеметрию, проверь альтернативы и запиши ограничения.</p><a class=\"btn small\" href=\"academy.html\">Разобрать процесс →</a></div><div class=\"mini-flow\"><div class=\"flow-step\"><span>01</span><b>Сигнал</b></div><div class=\"flow-step\"><span>02</span><b>Контекст</b></div><div class=\"flow-step\"><span>03</span><b>Проверка</b></div><div class=\"flow-step\"><span>04</span><b>Решение</b></div></div></div></section></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createEleme umns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"roadmap\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Маршрут</div><div class=\"eyebrow\">Твоя дорожная карта</div><h1>От основ до первого<br><span class=\"text-accent\">SOC-портфолио.</span></h1><p>Проходи этапы последовательно. Внутри каждого — объяснение, конкретные темы, практика, полезные материалы и критерий готовности. Отмечай задачу после самостоятельного выполнения, а не после простого прочтения.</p><div class=\"page-tags\"><span class=\"pill accent\">9 этапов</span><span class=\"pill\">прогресс в браузере</span><span class=\"pill\">ориентир: 4–8 ч/неделю</span></div></div><div class=\"content-layout\"><aside class=\"side-nav\"><div class=\"label\">НА ЭТОЙ СТРАНИЦЕ</div><a href=\"#progress\" class=\"active\">Общий прогресс</a><a href=\"#curriculum\">Учебные этапы</a><a href=\"#job-ready\">Критерии готовности</a></aside><div class=\"content\"><div id=\"progress\" class=\"progress-block\"><div class=\"progress-top\"><b>Отмеченные контрольные задачи</b><span data-progress-count>0/0</span></div><div class=\"progress-track\"><div class=\"progress-fill\" data-progress-fill></div></div><div style=\"display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:var(--muted)\"><span>По пунктам маршрута</span><span data-progress-percent>0%</span></div></div><div class=\"notice warn\"><strong>Важно:</strong> сроки — ориентир, а не обещание трудоустройства. Скорость зависит от опыта, регулярности и доступных ресурсов. Не считай тему освоенной, пока не можешь показать результат и объяснить ограничения.</div><div id=\"curriculum\"></div><section id=\"job-ready\" style=\"margin-top:34px\"><div class=\"section-head\"><div><div class=\"eyebrow\">Финальная проверка</div><h2>Готов ли ты к Junior SOC?</h2><p>Это практический чек-лист, не гарантия найма.</p></div></div><div class=\"card\"><label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"ready-net\"> Объясняю IP, DNS, TCP/UDP, TLS и читаю сетевой диалог.</label><label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"ready-os\"> Понимаю события входа, процессы и журналы Windows/Linux.</label><label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"ready-siem\"> Пишу и объясняю поиск по логам, задаю окно времени, проверяю результат.</label><label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"ready-triage\"> Разбираю алерт, собираю контекст и обосновываю решение.</label><label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"ready-writing\"> Документирую таймлайн, источники, пробелы и следующий шаг.</label><label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"ready-portfolio\"> Подготовил 2–3 безопасных учебных кейса для портфолио.</label><div class=\"passbox\"><b>Практический критерий</b>Пройди пункты без подсказок и попроси другого человека проверить кейсы. Портфолио должно показывать ход мысли, а не только скриншоты.</div></div></section></div></div></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Теперь твой маршрут',text:'Начни с карты навыков, выполняй лабораторные задания и сохраняй результаты в портфолио. Демо безопасны и используют фиксированные синтетические данные.'}\n  ];\n  const key='guidedTour';let focus=null,dialog=null,resizeHandler=null;\n  function pageName(){return ((document.body.dataset.page||'index')+'.html').toLowerCase()}\n  function remove(){if(focus)focus.remove();if(dialog)dialog.remove();focus=null;dialog=null;if(resizeHandler)window.removeEventListener('resize',resizeHandler);document.querySelectorAll('[data-tour-active]').forEach(e=>e.removeAttribute('data-tour-active'))}\n  function end(){remove();store.set(key,null);}\n  function show(index){\n    remove(); if(index<0||index>=steps.length){end();return}\n    store.set(key,index); const step=steps[index];\n    if(pageName()!==step.page){parent.postMessage({type:'soc-atlas-route',page:step.page.replace(/\\.html$/i,''),hash:'',tourIndex:index},'*');return}\n    let target=$(step.selector);\n    if(!target){let next=index+1;show(next);return}\n    target.scrollIntoView({behavior:'smooth',block:'center'});target.setAttribute('data-tour-active','');\n    focus=document.createElement('div');focus.className='tour-focus';focus.setAttribute('aria-hidden','true');document.body.appendChild(focus);\n    dialog=document.createElement('section');dialog.className='tour-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Экскурсия по сайту');\n    dialog.innerHTML=`<div class=\"tour-kicker\">SOC ATLAS · GUIDED TOUR</div><h3>${step.title}</h3><p>${step.text}</p><div class=\"tour-actions\"><div class=\"left\"><button class=\"tour-dismiss\" data-tour-close>Завершить</button></div><span class=\"tour-counter\">${String(index+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><div class=\"right\">${index?'<button class=\"btn small ghost\" data-tour-prev>← Назад</button>':''}<button class=\"btn small primary\" data-tour-next>${index===steps.length-1?'Завершить':'Далее →'}</button></div></div>`;\n    document.body.appendChild(dialog);\n    function position(){let r=target.getBoundingClientRect(),pad=5;focus.style.left=Math.max(5,r.left-pad)+'px';focus.style.top=Math.max(5,r.top-pad)+'px';focus.style.width=Math.min(window.innerWidth-10,r.width+pad*2)+'px';focus.style.height=Math.min(window.innerHeight-10,r.height+pad*2)+'px'}\n    position();resizeHandler=position;window.addEventListener('resize',resizeHandler);\n    dialog.querySelector('[data-tour-close]').onclick=end;\n    dialog.querySelector('[data-tour-next]').onclick=()=>show(index+1);\n    const prev=dialog.querySelector('[data-tour-prev]');if(prev)prev.onclick=()=>show(index-1);\n  }\n  const start=$('[data-tour-start]');if(start)start.addEventListener('click',()=>show(0));\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focus)end()});\n  const saved=store.get(key,null);\n  window.addEventListener('message',ev=>{if(ev.data?.type==='soc-atlas-tour-resume'&&Number.isInteger(ev.data.index))show(ev.data.index)});if(new URLSearchParams(location.search).has('tour')&&Number.isInteger(saved))show(saved);\n  window.setTimeout(()=>{const orphan=document.querySelector('.tour-focus');if(orphan&&!document.querySelector('.tour-dialog'))orphan.remove();},1800); // socatlas-tour-safety\n})();\n\n<\/script><script>\nwindow.SOC_CURRICULUM=[\n{id:'net',num:'01',title:'Сетевые основы',sub:'Понять обмен между клиентом и сервером',time:'2–4 недели',desc:'SOC интерпретирует сетевую телеметрию. Без понимания адресов, портов, DNS и состояний соединения алерт выглядит набором полей.',topics:['Модель TCP/IP и назначение уровней','IPv4/IPv6, маски, CIDR, частные и публичные адреса','TCP handshake, UDP, порты и состояния соединения','DNS: записи A/AAAA/CNAME/MX/TXT и TTL','HTTP/HTTPS, TLS, сертификаты, SNI и границы видимости','DHCP, ARP, NAT, шлюз и маршрутизация','Разница между пакетом, потоком, сессией и DNS-запросом'],practice:'В Packet Explorer найди DNS-запрос, TLS-сессию и серию TCP SYN. Для каждого запиши источник, назначение, протокол и что ещё неизвестно.',pass:'Без подсказки объясняешь IP и порт, отличаешь DNS от HTTP, понимаешь, почему HTTPS не показывает полное содержимое запроса.',resources:[['Cloudflare Learning — DNS','https://www.cloudflare.com/learning/dns/what-is-dns/'],['Wireshark User Guide','https://www.wireshark.org/docs/wsug_html_chunked/']]},\n{id:'os',num:'02',title:'Windows и Linux',sub:'Знать процессы, учётные записи и журналы',time:'3–5 недель',desc:'Нужно понимать обычную работу хоста, чтобы замечать аномалии в процессах, службах, задачах, правах и событиях входа.',topics:['Windows: процессы, родительский процесс, службы, планировщик задач','Windows Event Log: Security, System, PowerShell и Sysmon','События успешного/неуспешного входа и типы logon','Linux: пользователи, группы, права, процессы, systemd и cron','Журналы auth, syslog/journald, sudo и SSH','PowerShell/Bash: читать команды и искать в логах','Артефакты persistence: службы, автозапуск, scheduled tasks — на уровне обнаружения'],practice:'В Endpoint Lab построй таймлайн из входа, запуска процесса и создания задания. Выпиши субъект, действие, объект, время и источник.',pass:'Можешь объяснить дерево процессов и назвать нужные журналы. Понимаешь, почему одиночное событие не подтверждает атаку.',resources:[['Microsoft Learn — Windows Security','https://learn.microsoft.com/en-us/windows/security/'],['Microsoft Sysinternals','https://learn.microsoft.com/en-us/sysinternals/']]},\n{id:'logs',num:'03',title:'Логи и телеметрия',sub:'Извлекать факты и учитывать пробелы данных',time:'2–3 недели',desc:'Лог имеет источник, время, поля, идентификаторы и ограничения качества. Проверяй timezone, покрытие и полноту данных.',topics:['Timestamp, timezone, event ID, host, user, process, source IP','Нормализация полей и различия схем источников','Windows Security, Sysmon, firewall, DNS, proxy, EDR, cloud audit','Временные окна, clock skew, задержки поступления и дубли','Baseline нормального поведения','Наблюдение, гипотеза и вывод — разные категории','Безопасное обращение с чувствительной телеметрией'],practice:'В Mini SIEM найди события пользователя, сгруппируй по времени и источнику, отметь недостающие сведения.',pass:'Каждое утверждение связываешь с конкретным событием. Называешь источник, временное окно и ограничения.',resources:[['MITRE ATT&CK — Data Sources','https://attack.mitre.org/datasources/']]},\n{id:'siem',num:'04',title:'SIEM и язык запросов',sub:'Искать события и проверять гипотезы запросами',time:'3–5 недель',desc:'У разных SIEM различаются интерфейсы и языки, но базовые операции поиска и корреляции переносятся между платформами.',topics:['Индексы, data source, поля и временной диапазон','Фильтрация, сортировка, выбор полей и группировки','Splunk SPL: search, stats, timechart, table, eval — базовые идеи','KQL: where, project, summarize, extend, join','Корреляция по user, host, IP и времени','Проверка пропусков, дубликатов и слишком широких фильтров','Saved searches, dashboards, alerts и false positives'],practice:'В Mini SIEM отфильтруй ошибки входа, сгруппируй по пользователю и найди события в одном временном окне.',pass:'Объясняешь каждую часть запроса, проверяешь результаты исходными событиями и приводишь аргументы за и против гипотезы.',resources:[['Microsoft Learn — KQL','https://learn.microsoft.com/en-us/kusto/query/'],['Splunk Search Tutorial','https://docs.splunk.com/Documentation/Splunk/latest/SearchTutorial/WelcometotheSearchTutorial']]},\n{id:'triage',num:'05',title:'Триаж алертов L1',sub:'Оценить важность и обосновать решение',time:'2–4 недели',desc:'L1 проверяет контекст, собирает первичные доказательства, оценивает срочность и документирует решение. Следуй runbook и полномочиям.',topics:['Rule name, severity, asset, user, first/last seen и source','Контекст пользователя, хоста и обычного поведения','Scope: один аккаунт/хост или несколько','Severity, confidence, priority и business impact','Password spraying, suspicious PowerShell, impossible travel, malware alert','False positive, benign true positive, suspicious и confirmed incident','Критерии эскалации, SLA и ограничения полномочий'],practice:'В Case Room изучи пять артефактов. Запиши факты, гипотезы, выполненные проверки, неизвестные данные и основание эскалации.',pass:'Тикет воспроизводим: что произошло, какие есть доказательства, что проверено, чего не хватает и что делать дальше.',resources:[['NIST SP 800-61 Rev. 2','https://csrc.nist.gov/pubs/sp/800/61/r2/final'],['MITRE ATT&CK','https://attack.mitre.org/']]},\n{id:'networklab',num:'06',title:'Анализ сетевых инцидентов',sub:'Использовать пакеты как источник доказательств',time:'2–3 недели',desc:'Wireshark помогает изучать трафик, но сам по себе не является детектором атак. Сопоставляй сети с endpoint, DNS, proxy и контекстом.',topics:['Frame, Ethernet, IP, TCP/UDP, DNS, HTTP и TLS','Display filters: dns, tcp, ip.addr, tcp.flags, http.request','Follow TCP Stream и ограничения при TLS','Retransmissions, resets и необычные DNS-последовательности','Признаки сканирования/beaconing без преждевременных выводов','Экспорт артефактов только в разрешённой лаборатории','Сохранение захвата, фильтра, времени и контекста'],practice:'В Packet Explorer примени dns и tcp.port == 443. Сравни нормальный обмен и серию SYN к одному адресу; запиши наблюдения и неизвестные.',pass:'Описываешь поток, объясняешь фильтр и связываешь пакеты с другими источниками. Не объявляешь один необычный порт вредоносным.',resources:[['Wireshark Display Filters','https://www.wireshark.org/docs/man-pages/wireshark-filter.html'],['Wireshark Sample Captures','https://wiki.wireshark.org/SampleCaptures']]},\n{id:'detect',num:'07',title:'Детекты и MITRE ATT&CK',sub:'Понимать логику обнаружения и её ограничения',time:'2–4 недели',desc:'Детект — проверяемая гипотеза в форме условия. Его качество зависит от источников данных, baseline, порогов, тестирования и сопровождения.',topics:['Тактика/техника ATT&CK; матрица — не доказательство','Поведенческие сигналы и последовательности событий','Корреляция, временные окна, пороги и allowlists','Sigma как переносимое описание логики детекта','False positives и false negatives','Тестовые данные и безопасная проверка правила','Описание цели, полей, источников, ограничений и triage notes'],practice:'В Detection Studio настрой правило для неудачных логинов и последующего успеха; опиши порог, окно, исключения и тесты.',pass:'Объясняешь поведение, требуемые данные, причины ошибок правила и процедуру разбора сработки.',resources:[['MITRE ATT&CK Enterprise','https://attack.mitre.org/matrices/enterprise/'],['SigmaHQ rules','https://github.com/SigmaHQ/sigma']]},\n{id:'ir',num:'08',title:'Реагирование и коммуникация',sub:'Сохранять доказательства и действовать по процедуре',time:'2 недели',desc:'Изоляция хоста, блокировки и отключение аккаунтов выполняются по утверждённой процедуре и полномочиям. Учимся безопасно передавать дело.',topics:['Первичный scope и влияние на бизнес','Сбор доказательств и временная шкала','Эскалация IR/IT/identity/cloud owner','Containment, eradication и recovery — различия','Источник, confidence и срок актуальности IOC','Handoff: impact, evidence, next steps','Post-incident review и улучшение детектов'],practice:'Собери таймлайн, резюме и handoff для старшего аналитика в Case Room.',pass:'Коллега может продолжить расследование без устного пересказа: есть время, источники, факты, неизвестные и следующий шаг.',resources:[['NIST Cybersecurity Framework','https://www.nist.gov/cyberframework'],['CISA — Incident Response','https://www.cisa.gov/topics/cyber-threats-and-advisories']]},\n{id:'portfolio',num:'09',title:'Портфолио и трудоустройство',sub:'Показывать не только знания, но и ход мышления',time:'3–4 недели',desc:'Для первой роли нужны практические доказательства: аккуратные кейсы, запросы, технические объяснения и способность честно говорить о неизвестных данных.',topics:['Кейс фишингового письма с признаками и решением','Сетевой разбор с фильтрами и таймлайном','SIEM detection rule с обоснованием и тестами','README, структура репозитория и безопасные скриншоты','Резюме на одну страницу с навыками и доказательствами','Интервью: TCP/DNS, Windows logs, triage, false positives','Поиск Junior SOC / security monitoring / IT support / NOC'],practice:'Опубликуй три учебных кейса: задача, телеметрия, запрос/фильтр, факты, решение, ограничения и выводы. Пройди Interview Prep.',pass:'Самостоятельно проходишь кейс от сырого события до документированного решения. Не включаешь реальные секреты или чужие данные.',resources:[['MITRE ATT&CK','https://attack.mitre.org/'],['CyberDefenders Labs','https://cyberdefenders.org/']]}\n];\n\n<\/script><script>\n(()=>{let host=document.querySelector('#curriculum');if(!host||!window.SOC_CURRICULUM)return;const esc=SOC.esc;host.innerHTML=SOC_CURRICULUM.map(m=>`<details class=\"module reveal\" id=\"step-${m.id}\"><summary><span class=\"module-num\">${m.num}</span><span class=\"module-heading\"><b>${m.title}</b><span>${m.sub}</span></span><span class=\"pill\">${m.time}</span></summary><div class=\"module-body\"><p>${m.desc}</p><h4>Что изучить</h4>${m.topics.map((t,i)=>`<label class=\"checkrow\"><input type=\"checkbox\" data-progress-id=\"${m.id}-${i}\"> ${esc(t)}</label>`).join('')}<h4>Практика</h4><p>${m.practice}</p><h4>Материалы</h4><ul>${m.resources.map(r=>`<li><a class=\"inline-link\" href=\"${r[1]}\" target=\"_blank\" rel=\"noreferrer\">${esc(r[0])}</a></li>`).join('')}</ul><div class=\"passbox\"><b>Критерий готовности</b>${m.pass}</div></div></details>`).join('');document.dispatchEvent(new CustomEvent('soc:progress'))})();\n\n<\/script><script>\n(()=>{\n const allowed=new Set(['index','roadmap','academy','tools','lab-wireshark','siem','cases','detection','endpoint','phishing','interview']);\n document.addEventListener('click',ev=>{\n   const a=ev.target.closest('a[href]'); if(!a||ev.defaultPrevented||a.target||a.hasAttribute('download'))return;\n   const href=a.getAttribute('href'); if(!href||/^(https?:|mailto:|tel:|javascript:|#)/i.test(href))return;\n   const m=href.match(/^([^?#]+\\.html)(?:\\?([^#]*))?(?:#(.*))?$/i); if(!m)return;\n   const key=m[1].split('/').pop().replace(/\\.html$/i,'').toLowerCase(); if(!allowed.has(key))return;\n   ev.preventDefault(); const qs=new URLSearchParams(m[2]||''); parent.postMessage({type:'soc-atlas-route',page:key,hash:m[3]||'',tour:qs.has('tour')},'*');\n });\n window.addEventListener('message',ev=>{\n   if(ev.data?.type==='soc-atlas-tour-resume'&&Number.isInteger(ev.data.index)){\n     window.dispatchEvent(new MessageEvent('message',{data:ev.data}));\n   }\n });\n})();\n<\/script>\n</body></html>","academy":"<!doctype html><html lang=\"ru\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#edf1f3\"><title>Учебный центр — SOC Atlas</title><style>\n:root{--bg:#edf1f3;--panel:#ffffff;--panel2:#f4f6f8;--line:#d1d9df;--text:#202a31;--muted:#56656f;--subtle:#737f88;--accent:#70991f;--blue:#276abb;--orange:#a86611;--red:#b83636;--green:#287642;--radius:18px;--mono:'DM Mono',ui-monospace,Consolas,monospace;--sans:'Manrope',Inter,system-ui,sans-serif;--shadow:0 24px 70px #2939451a}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 var(--sans);overflow-x:hidden}body:before{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:-2;background-image:linear-gradient(#26364006 1px,transparent 1px),linear-gradient(90deg,#26364006 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}body:after{content:\"\";position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#70991f0b,transparent 68%);top:-180px;right:-120px;pointer-events:none;z-index:-1;animation:glow 16s ease-in-out infinite alternate}@keyframes glow{to{transform:translate(-110px,150px) scale(1.15)}}@keyframes pulse{70%{box-shadow:0 0 0 7px #70991f00}}@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}*{scrollbar-color:#a8b2b9 #ffffff}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}::selection{background:#70991f40;color:white}.mono,.eyebrow,.tag,.kicker,.table th,.terminal,.code,.stat-value{font-family:var(--mono)}\n.topbar{height:72px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;padding:0 max(26px,calc((100vw - 1380px)/2));background:#edf1f3f2;backdrop-filter:blur(18px);border-bottom:1px solid #26364012}.brand{display:flex;align-items:center;gap:11px;min-width:190px;font-weight:800;letter-spacing:.12em;font-size:12px}.brand-mark{width:31px;height:31px;display:grid;place-items:center;border:1px solid #70991f70;color:var(--accent);border-radius:9px;background:#70991f0b;box-shadow:0 0 24px #70991f14;font:17px var(--mono)}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:.16em;font-size:9px;margin-top:-2px}.nav{display:flex;align-items:center;gap:4px;flex:1}.nav a{font-size:11px;color:var(--muted);padding:9px 10px;border-radius:9px;transition:.2s;white-space:nowrap}.nav a:hover,.nav a.active{color:var(--text);background:#263640 ss=\"active\" href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header>\n<main class=\"wrap\">\n<div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Учебный центр</div><div class=\"eyebrow\">BEGINNER FRIENDLY · ЗНАНИЯ С НУЛЯ</div><h1>Понимать, а не зубрить.<br><span class=\"text-accent\">Учебный центр SOC.</span></h1><p>Эта страница рассчитана на человека, который пока не знаком с сетями и мониторингом. Читай разделы по порядку: сначала базовые понятия, затем разбор событий и только после этого — решения аналитика.</p><div class=\"page-tags\"><span class=\"pill accent\">9 МОДУЛЕЙ</span><span class=\"pill\">ПРИМЕРЫ И АНАЛОГИИ</span><span class=\"pill\">МИНИ-ПРОВЕРКИ</span></div></div>\n<nav class=\"side-nav\" aria-label=\"Содержание урока\"><span class=\"label\">СОДЕРЖАНИЕ</span><a href=\"#soc-role\">Роль SOC</a><a href=\"#network-basics\">Сеть</a><a href=\"#protocols\">Протоколы</a><a href=\"#siem-flow\">От события к алерту</a><a href=\"#investigation\">Расследование</a><a href=\"#decisions\">Решение</a><a href=\"#glossary\">Словарь</a></nav>\n<section class=\"theory-section\" id=\"soc-role\"><div class=\"eyebrow\">МОДУЛЬ 01 · ЗАЧЕМ ЭТО НУЖНО</div><h2>Что вообще делает SOC-аналитик?</h2><p>SOC — Security Operations Center, команда или функция, которая наблюдает за событиями безопасности, разбирает подозрительные сигналы и помогает организации реагировать на инциденты. SOC Analyst L1 обычно выполняет первичную проверку, собирает доказательства, документирует результат и передаёт сложные случаи следующему уровню.</p><div class=\"flow-demo\"><div class=\"flowbox\"><b>1. Наблюдать</b><span>Получать события из компьютеров, серверов, сети, почты и облака.</span></div><div class=\"flowbox\"><b>2. Проверять</b><span>Сопоставлять время, пользователя, устройство и соседние события.</span></div><div class=\"flowbox\"><b>3. Решать и записывать</b><span>Обосновать закрытие, продолжить поиск или эскалировать по процедуре.</span></div></div><div class=\"notice\"><strong>Главная идея:</strong> аналитик не «угадывает хакера». Он собирает проверяемые факты, задаёт вопросы, тестирует гипотезы и объясняет, почему выбрал конкретное действие.</div><div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">ПРИМЕР</div><h3>Обычное событие</h3><p>Сотрудник успешно вошёл в рабочую систему утром со знакомого устройства. Это полезная запись для аудита, но сама по себе обычно не означает угрозу.</p><div class=\"example\">Вопрос аналитика: соответствует ли вход обычному поведению пользователя?</div></article><article class=\"concept-card\"><div class=\"concept-num\">ПРИМЕР</div><h3>Подозрительное событие</h3><p>Для одной учётной записи идут многочисленные неудачные входы, а сразу после них появляется необычный успешный вход. Это повод изучить последовательность.</p><div class=\"example\">Вопрос аналитика: кто входил, откуда, с какого устройства и были ли изменения после входа?</div></article><article class=\"concept-card\"><div class=\"concept-num\">ВАЖНО</div><h3>У аналитика есть границы</h3><p>L1 не должен самовольно отключать рабочие сервисы, менять настройки защиты или обращаться к посторонним системам. Он следует runbook и эскалирует при необходимости.</p><div class=\"example\">Хорошее расследование можно повторить по его заметкам.</div></article></div></section>\n<section class=\"theory-section\" id=\"network-basics\"><div class=\"eyebrow\">МОДУЛЬ 02 · ОСНОВЫ СЕТИ</div><h2>IP, порт, пакет и соединение — простым языком</h2><p>Представь большой офис с адресами и внутренними отделами. Сетевое устройство отправляет данные другому устройству, а на принимающем компьютере данные должны попасть нужной программе. Для этого работают разные поля заголовков и протоколы.</p><div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">A / IP-АДРЕС</div><h3>Куда доставить данные</h3><p>IP-адрес идентифицирует сетевой endpoint в рамках IP-сети. Частные адреса, например 10.10.5.24, часто используются внутри организаций. Один IP не всегда соответствует одному человеку: устройство может быть общим, адрес — динамическим, а трафик — проходить через NAT или прокси.</p><div class=\"example\">Не говори «это точно Максим». Корректнее: «в журнале видно событие с адреса X; владельца и пользователя ещё нужно подтвердить».</div></article><article class=\"concept-card\"><div class=\"concept-num\">B / ПОРТ</div><h3>Какую программу вызвать</h3><p>Порт — числовой идентификатор сетевой службы на транспортном уровне. Он помогает операционной системе направить трафик приложению. Это не физическое отверстие и не секретный канал.</p><div class=\"example\">Примеры: TCP/443 часто используется HTTPS, UDP/53 — обычный DNS. Но номер порта сам по себе не доказывает, какое именно приложение перед нами.</div></article><article class=\"concept-card\"><div class=\"concept-num\">C / ПАКЕТ</div><h3>Небольшая порция передачи</h3><p>В сетевой трассе анализатор показывает кадры или пакеты с временем, адресами, протоколом, длиной и декодированными полями. Большое сообщение может передаваться несколькими пакетами.</p><div class=\"example\">Одна строка в таблице — не вся беседа. Чтобы понять её смысл, смотри последовательность пакетов и всю сессию.</div></article></div><h3 style=\"font-size:23px;margin-top:30px\">Путь от отправителя к приложению</h3><div class=\"packet-anatomy\"><div><b>Ethernet / Wi-Fi</b><span>Доставка по локальному каналу между соседними узлами.</span></div><div><b>IP</b><span>Адрес источника и назначения между сетями.</span></div><div><b>TCP / UDP</b><span>Передача между портами приложений.</span></div><div><b>Протокол приложения</b><span>Например DNS, HTTP или TLS.</span></div><div><b>Данные</b><span>Полезная нагрузка; она может быть зашифрована.</span></div></div><p>Эта модель упрощена для обучения: реальные сетевые стеки могут включать дополнительные протоколы и туннели. Но она помогает постепенно разбирать пакет, а не воспринимать строку как набор случайных букв.</p></section>\n<section class=\"theory-section\" id=\"protocols\"><div class=\"eyebrow\">МОДУЛЬ 03 · ПРОТОКОЛЫ</div><h2>Что делают TCP, UDP, DNS, HTTP и TLS?</h2><div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">TCP</div><h3>Управляемый поток</h3><p>TCP устанавливает состояние соединения, нумерует данные, подтверждает полученное и может повторно передавать потерянное. Поэтому в трассе можно увидеть начало соединения, подтверждения и завершение.</p><div class=\"example\">SYN → SYN/ACK → ACK — обычное трёхшаговое начало TCP-соединения.</div></article><article class=\"concept-card\"><div class=\"concept-num\">UDP</div><h3>Датаграммы</h3><p>UDP передаёт независимые датаграммы и не обеспечивает надёжную доставку или порядок на уровне самого UDP. Это не делает UDP плохим или подозрительным — протокол подходит многим задачам.</p><div class=\"example\">DNS часто использует UDP, но может использовать TCP и другие варианты в зависимости от ситуации.</div></article><article class=\"concept-card\"><div class=\"concept-num\">DNS</div><h3>Поиск по имени</h3><p>DNS позволяет узнать, какой IP или другая запись связана с доменным именем. Запрос DNS помогает восстановить контекст, но нормальные приложения постоянно используют DNS.</p><div class=\"example\">Проверяй имя, тип записи, ответ, частоту и соответствие обычным задачам устройства.</div></article><article class=\"concept-card\"><div class=\"concept-num\">HTTP</div><h3>Запросы веб-приложения</h3><p>HTTP задаёт формат запросов и ответов: метод, путь, заголовки, статус и содержимое. Если соединение не защищено TLS, часть этих данных может быть видна на пути между клиентом и сервером.</p><div class=\"example\">GET — запросить ресурс. Код 200 обычно означает успешный ответ, но не доказывает, что бизнес-операция была корректной.</div></article><article class=\"concept-card\"><div class=\"concept-num\">TLS / HTTPS</div><h3>Защищённый канал</h3><p>TLS обеспечивает шифрование и проверку подлинности сервера при корректной настройке. В пассивном захвате обычно видны адреса, порты, время и размеры, но не само содержимое HTTPS.</p><div class=\"example\">Не обещай раскрыть «все пароли из HTTPS» по одному PCAP: это неверно и игнорирует шифрование.</div></article><article class=\"concept-card\"><div class=\"concept-num\">ICMP</div><h3>Сетевые сообщения</h3><p>ICMP используется для сообщений об ошибках и диагностики сетей. Некоторые инструменты используют ICMP для проверки достижимости, но отсутствие ответа не всегда означает, что хост выключен: сообщения могут фильтроваться.</p><div class=\"example\">Учитывай правила межсетевых экранов, маршрут и другие источники наблюдения.</div></article></div></section>\n<section class=\"theory-section\" id=\"siem-flow\"><div class=\"eyebrow\">МОДУЛЬ 04 · КАК ПОЯВЛЯЕТСЯ АЛЕРТ</div><h2>Как сырые записи превращаются в работу SOC</h2><p>SIEM собирает события из многих источников, нормализует поля, индексирует их и выполняет поиск или корреляцию. Детектирующее правило может создать алерт, когда выполнены заданные условия. Аналитик затем проверяет, соответствует ли сигнал реальной угрозе.</p><div class=\"flow-demo\"><div class=\"flowbox\"><b>Источники</b><span>Windows, EDR, VPN, DNS, firewall, облачные журналы.</span></div><div class=\"flowbox\"><b>SIEM + правило</b><span>События объединяются по полям и временному окну; срабатывает условие.</span></div><div class=\"flowbox\"><b>Алерт + человек</b><span>L1 проверяет факты, добавляет контекст и принимает решение.</span></div></div><div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">СОБЫТИЕ</div><h3>Запись о факте</h3><p>Например, журнал авторизации сообщает, что вход не удался в 09:42:15. Событие может быть штатным и не вызовет алерта.</p></article><article class=\"concept-card\"><div class=\"concept-num\">АЛЕРТ</div><h3>Сигнал, требующий проверки</h3><p>Правило заметило, например, много неудачных входов за короткое окно. Алерт — не приговор и не доказательство компрометации.</p></article><article class=\"concept-card\"><div class=\"concept-num\">ИНЦИДЕНТ</div><h3>Обоснованное событие безопасности</h3><p>После проверки собраны достаточные признаки реального нарушения или риска, требующего скоординированной реакции по процессу организации.</p></article></div><div class=\"notice\"><strong>Почему появляются ложные срабатывания?</strong> Детектор видит шаблон, а не полную картину. Администратор может делать массовое обновление, пользователь — ошибаться с паролем, а сервис — повторять запросы. Контекст и проверка нужны именно для этого.</div></section>\n<section class=\"theory-section\" id=\"investigation\"><div class=\"eyebrow\">МОДУЛЬ 05 · ПРАКТИЧЕСКОЕ МЫШЛЕНИЕ</div><h2>Как расследовать алерт: последовательность действий</h2><p>Не начинай с вопроса «кто виноват?». Начни с вопроса «что точно известно?». Ниже — пример типичного алерта о подозрительной активности входа.</p><div class=\"flow-demo\"><div class=\"flowbox\"><b>Наблюдение</b><span>15 неудачных входов за 2 минуты для нескольких учётных записей.</span></div><div class=\"flowbox\"><b>Гипотеза</b><span>Возможно, кто-то массово проверяет пароли. Возможны и автоматизация/ошибка сервиса.</span></div><div class=\"flowbox\"><b>Проверка</b><span>Сравни источник, временное окно, целевые учётки и наличие успешного входа позже.</span></div></div><div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">ШАГ 1</div><h3>Уточнить сигнал</h3><p>Запиши название правила, почему оно сработало, точный интервал и какие поля привели к созданию алерта. Убедись, что часы и часовые пояса согласованы.</p></article><article class=\"concept-card\"><div class=\"concept-num\">ШАГ 2</div><h3>Собрать контекст</h3><p>Найди события до и после. Проверь пользователя, устройство, источник, географию только если она достоверно доступна, тип входа, MFA и критичность системы.</p></article><article class=\"concept-card\"><div class=\"concept-num\">ШАГ 3</div><h3>Сформировать альтернативы</h3><p>Это может быть атака, забытый пароль, скрипт со старым секретом, тест администратора или ошибочная интеграция. Не выбирай объяснение до проверки.</p></article><article class=\"concept-card\"><div class=\"concept-num\">ШАГ 4</div><h3>Проверить доказательства</h3><p>Сравни связанные записи из источников авторизации, endpoint и VPN. Сохрани исходные значения, идентификаторы событий и временные метки.</p></article><article class=\"concept-card\"><div class=\"concept-num\">ШАГ 5</div><h3>Оценить уверенность</h3><p>Отдельно опиши факты, свою интерпретацию и то, чего не хватает. Уверенность относится к силе доказательств, а не к тому, насколько тревожно выглядит заголовок.</p></article><article class=\"concept-card\"><div class=\"concept-num\">ШАГ 6</div><h3>Документировать и передать</h3><p>Краткое резюме, затронутые активы, хронология, запросы, найденные факты, ограничения, решение и следующий рекомендуемый шаг. Следуй процедурам организации.</p></article></div><details class=\"module\"><summary>Показать пример хорошей аналитической заметки</summary><div class=\"module-body\"><p><b>Наблюдение:</b> за две минуты зафиксировано 15 неудачных попыток для пяти учётных записей с одного адреса; через минуту один из пользователей успешно вошёл с ранее не наблюдавшегося устройства.</p><p><b>Гипотеза:</b> возможно, массовая проверка паролей с последующим использованием валидных учётных данных.</p><p><b>Что проверено:</b> время совпадает в двух источниках; успешный вход присутствует; журнал MFA ещё не получен.</p><p><b>Ограничения:</b> пока нельзя подтвердить, кто управлял источником или было ли устройство скомпрометировано.</p><p><b>Следующий шаг:</b> получить телеметрию MFA и endpoint, проверить легитимность сессии и уведомить ответственного по утверждённой процедуре.</p></div></details></section>\n<section class=\"theory-section\" id=\"decisions\"><div class=\"eyebrow\">МОДУЛЬ 06 · ПРИНЯТИЕ РЕШЕНИЙ</div><h2>Severity, confidence и priority — не одно и то же</h2><div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">SEVERITY</div><h3>Насколько серьёзно?</h3><p>Оценивает потенциальное воздействие события, например затронут ли критичный сервер, привилегированная учётная запись или множество пользователей.</p></article><article class=\"concept-card\"><div class=\"concept-num\">CONFIDENCE</div><h3>Насколько мы уверены?</h3><p>Показывает, насколько хорошо имеющиеся доказательства поддерживают вывод. Несколько независимых источников обычно полезнее одиночного слабого сигнала.</p></article><article class=\"concept-card\"><div class=\"concept-num\">PRIORITY</div><h3>Что делать первым?</h3><p>Определяет очередность работ с учётом потенциального ущерба, срочности, критичности актива, сроков реакции и доступных ресурсов.</p></article></div><div class=\"notice warn\"><strong>Пример:</strong> высокая тяжесть и низкая уверенность часто означают «проверить срочно», а не «немедленно объявить атаку». Следуй runbook и полномочиям своей роли.</div></section>\n<section class=\"theory-section\" id=\"glossary\"><div class=\"eyebrow\">МОДУЛЬ 07 · СЛОВАРЬ</div><h2>Слова, которые будешь часто встречать</h2><p>Нажимай на термин, если хочешь закрепить смысл. Вначале достаточно понимать идею; точные детали появятся в практических заданиях.</p><div class=\"grid two\"><details class=\"module\"><summary>IOC — индикатор компрометации</summary><div class=\"module-body\">Наблюдаемый артефакт, который может быть связан с инцидентом: хеш файла, домен, IP, путь или другое значение. IOC требует контекста: хороший индикатор может устареть или встречаться в легитимной активности.</div></details><details class=\"module\"><summary>EDR — защита и телеметрия endpoint</summary><div class=\"module-body\">Система, которая собирает события с рабочих станций и серверов, например запуск процессов, дерево процессов, изменения файлов и защитные обнаружения. EDR помогает увидеть, что происходило на самом устройстве.</div></details><details class=\"module\"><summary>SIEM — сбор и корреляция событий</summary><div class=\"module-body\">Платформа для приёма журналов, поиска, корреляции и генерации алертов. Её качество зависит от полноты данных, нормализации, корректности времени и хороших правил.</div></details><details class=\"module\"><summary>False positive — ложноположительное срабатывание</summary><div class=\"module-body\">Система отметила событие подозрительным, но после проверки оно оказалось легитимным или неопасным по критериям детектора. Причину полезно документировать, чтобы улучшать правила.</div></details><details class=\"module\"><summary>False negative — пропущенная угроза</summary><div class=\"module-body\">Опасная активность произошла, но детектор не выдал сигнал. Уменьшить риск помогают качественная телеметрия, тестирование правил и анализ реальных случаев.</div></details><details class=\"module\"><summary>Baseline — нормальное поведение</summary><div class=\"module-body\">Представление о типичной активности системы, пользователя или сети. Без baseline аналитик может принимать обычные пики, резервное копирование или обновления за аномалию.</div></details><details class=\"module\"><summary>Runbook — инструкция реагирования</summary><div class=\"module-body\">Пошаговая процедура, которая задаёт необходимые проверки, ограничения полномочий, условия эскалации и формат документирования.</div></details><details class=\"module\"><summary>Escalation — эскалация</summary><div class=\"module-body\">Передача случая специалисту или команде с нужными полномочиями, когда риск высок, требуется дополнительная экспертиза или L1 не может безопасно выполнить следующий шаг.</div></details><details class=\"module\"><summary>PCAP — файл сетевого захвата</summary><div class=\"module-body\">Файл с сохранёнными пакетами. В нём могут быть чувствительные метаданные и, если трафик не зашифрован, содержимое. Работать с ним следует только при наличии разрешения и правил хранения.</div></details><details class=\"module\"><summary>MITRE ATT&amp;CK</summary><div class=\"module-body\">База знаний тактик и техник поведения противника. Помогает одинаково описывать наблюдения, но само присвоение техники не доказывает, что атака действительно произошла.</div></details></div></section>\n<section class=\"theory-section\"><div class=\"eyebrow\">ПРОВЕРЬ ПОНИМАНИЕ</div><h2>Маленькая самопроверка</h2><div class=\"grid two\"><article class=\"card\"><h3>Ситуация 1</h3><p>Ты видишь один DNS-запрос к незнакомому имени. Что это означает?</p><details class=\"module\"><summary>Показать разбор</summary><div class=\"module-body\">Только то, что устройство запросило имя. Это может быть нормальная работа приложения. Проверь домен, устройство, периодичность, ответ и сопутствующие события.</div></details></article><article class=\"card\"><h3>Ситуация 2</h3><p>В таблице видно много SYN-пакетов. Можно ли сразу заявить, что это DDoS?</p><details class=\"module\"><summary>Показать разбор</summary><div class=\"module-body\">Нет. SYN — нормальная часть TCP handshake. Проверяют скорость, распределение источников, завершение соединений, реакцию сервера, сетевые потери и базовую нагрузку.</div></details></article><article class=\"card\"><h3>Ситуация 3</h3><p>Алерт имеет высокий severity, но доказательств пока мало. Как действовать?</p><details class=\"module\"><summary>Показать разбор</summary><div class=\"module-body\">Уточнить факты и быстро выполнить необходимые проверки по процедуре. Зафиксировать низкую уверенность и неизвестные данные. Не объявлять компрометацию без подтверждения.</div></details></article><article class=\"card\"><h3>Ситуация 4</h3><p>Ты видишь IP-адрес в журнале. Означает ли он, что удалось определить конкретного человека?</p><details class=\"module\"><summary>Показать разбор</summary><div class=\"module-body\">Нет. IP может быть общим, динамическим, NAT-адресом, VPN или прокси. Нужны другие журналы и уполномоченный процесс атрибуции; в заметках нужно описывать только подтверждённое.</div></details></article></div></section>\n<section class=\"theory-section\"><div class=\"eyebrow\">ИСТОЧНИКИ ДЛЯ ДАЛЬНЕЙШЕГО ОБУЧЕНИЯ</div><h2>Официальные материалы</h2><div class=\"grid three\"><article class=\"card\"><h3>Wireshark</h3><p>Справочник синтаксиса фильтров отображения и полей протоколов.</p><a class=\"btn\" href=\"https://www.wireshark.org/docs/man-pages/wireshark-filter.html\" target=\"_blank\" rel=\"noreferrer\">Документация ↗</a></article><article class=\"card\"><h3>MITRE ATT&amp;CK</h3><p>Тактики и техники, используемые для систематизации наблюдаемого поведения.</p><a class=\"btn\" href=\"https://attack.mitre.org/\" target=\"_blank\" rel=\"noreferrer\">База знаний ↗</a></article><article class=\"card\"><h3>CISA: DDoS</h3><p>Рекомендации по подготовке к инцидентам отказа в обслуживании и реагированию.</p><a class=\"btn\" href=\"https://www.cisa.gov/sites/default/files/publications/understanding-and-responding-to-ddos-attacks_508c.pdf\" target=\"_blank\" rel=\"noreferrer\">Руководство ↗</a></article></div></section>\n<div class=\"notice\"><strong>Как изучать сайт:</strong> после этого раздела перейди в <a class=\"inline-link\" href=\"lab-wireshark.html\">Packet Lab</a>, запусти синтетический захват и выполни команды <code>help</code>, <code>connections</code>, <code>ip 10.10.5.24</code>. Затем перейди в <a class=\"inline-link\" href=\"siem.html\">Mini SIEM</a> и попробуй связать сетевые наблюдения с журналами.</div>\n</main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Материалы для начинающих · синтетические кейсы</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Тепе (); const qs=new URLSearchParams(m[2]||''); parent.postMessage({type:'soc-atlas-route',page:key,hash:m[3]||'',tour:qs.has('tour')},'*');\n });\n window.addEventListener('message',ev=>{\n   if(ev.data?.type==='soc-atlas-tour-resume'&&Number.isInteger(ev.data.index)){\n     window.dispatchEvent(new MessageEvent('message',{data:ev.data}));\n   }\n });\n})();\n<\/script>\n</body></html>\n","tools":"<!doctype html><html lang=\"ru\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#edf1f3\"><title>Инструменты — SOC Atlas</title><style>\n:root{--bg:#edf1f3;--panel:#ffffff;--panel2:#f4f6f8;--line:#d1d9df;--text:#202a31;--muted:#56656f;--subtle:#737f88;--accent:#70991f;--blue:#276abb;--orange:#a86611;--red:#b83636;--green:#287642;--radius:18px;--mono:'DM Mono',ui-monospace,Consolas,monospace;--sans:'Manrope',Inter,system-ui,sans-serif;--shadow:0 24px 70px #2939451a}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 var(--sans);overflow-x:hidden}body:before{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:-2;background-image:linear-gradient(#26364006 1px,transparent 1px),linear-gradient(90deg,#26364006 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}body:after{content:\"\";position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#70991f0b,transparent 68%);top:-180px;right:-120px;pointer-events:none;z-index:-1;animation:glow 16s ease-in-out infinite alternate}@keyframes glow{to{transform:translate(-110px,150px) scale(1.15)}}@keyframes pulse{70%{box-shadow:0 0 0 7px #70991f00}}@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}*{scrollbar-color:#a8b2b9 #ffffff}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button
