%;height:auto;min-height:350px}\n.connection-map .edge{stroke:#9cabb3;stroke-width:2;stroke-dasharray:5 5;animation:flowDash 2.5s linear infinite;fill:none}\n.connection-map .edge.alert{stroke:#c45e52}.connection-map .node{cursor:pointer;transition:transform .2s}.connection-map .node:hover{filter:drop-shadow(0 3px 5px #1c2b3728)}\n.connection-map .node circle{fill:#fff;stroke:#94a5ae;stroke-width:2}.connection-map .node.server circle{fill:#edf6db;stroke:#759b33}.connection-map .node.external circle{fill:#fff0e9;stroke:#c47757}.connection-map .node text{font:12px var(--mono);fill:#24343d;text-anchor:middle}.connection-map .node .node-name{font:11px system-ui;fill:#596b75}\n@keyframes flowDash{to{stroke-dashoffset:-40}}\n.connection-list{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px}.connection-list h3{margin:0 0 11px;font-size:18px}.connection-list p{font-size:14px;line-height:1.8;color:var(--muted)}.conn-item{padding:12px 0;border-bottom:1px solid #dfe5e9}.conn-item:last-child{border-bottom:0}.conn-item button{display:block;background:transparent;border:0;text-align:left;color:#263842;width:100%;font:13px var(--mono);line-height:1.7}.conn-item button:hover{color:var(--accent)}.conn-item small{display:block;color:var(--muted);font:13px/1.7 var(--sans)}\n.theory-section{margin:52px 0}.theory-section h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.035em;margin:0 0 12px}.theory-section>p{max-width:950px;font-size:17px;line-height:1.9;color:#40525c}\n.concept-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.concept-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.concept-card .concept-num{color:var(--accent);font:13px var(--mono);margin-bottom:10px}.concept-card h3{font-size:19px;margin:0 0 9px}.concept-card p{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 11px}.concept-card .example{padding:12px;border-radius:9px;background:#f2f6e9;color:#3d5423;font-size:14px;line-height:1.8}\n.packet-anatomy{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.packet-anatomy div{min-height:93px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.packet-anatomy b{font-size:14px;display:block;margin-bottom:6px}.packet-anatomy span{font-size:13px;line-height:1.6;color:var(--muted)}\n.flow-demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch;margin:18px 0}.flow-demo .flowbox{padding:17px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}.flow-demo .flowbox b{font-size:16px;display:block}.flow-demo .flowbox span{font-size:14px;color:var(--muted);line-height:1.7;display:block;margin-top:5px}.flow-arrow{color:var(--accent);font-size:25px;align-self:center;text-align:center}\n.traffic-sim{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:22px 0}.traffic-sim h3{font-size:22px;margin:0 0 8px}.traffic-sim>p{font-size:15px;line-height:1.8;color:var(--muted)}.traffic-mode-row{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.traffic-metric{display:grid;grid-template-columns:130px minmax(0,1fr) 95px;gap:12px;align-items:center;margin:13px 0;font-size:14px}.traffic-track{height:18px;background:#e7ecef;border-radius:99px;overflow:hidden}.traffic-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a3d359,#6f9d20);transition:width .9s cubic-bezier(.2,.8,.2,1)}.traffic-fill.warn{background:linear-gradient(90deg,#f6c36d,#c25d45)}.traffic-metric strong{font:13px var(--mono);text-align:right}.traffic-outcome{padding:15px;border-radius:10px;background:#f1f6e6;border:1px solid #d3e4b6;color:#435c25;font-size:15px;line-height:1.8;margin-top:16px}.traffic-sources{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.traffic-source{border:1px solid #e5b6a4;background:#fff3ed;color:#8d442f;border-radius:7px;padding:8px 10px;font:12px var(--mono);animation:sourcePulse 1.4s ease-in-out infinite alternate}@keyframes sourcePulse{to{transform:translateY(-3px);box-shadow:0 6px 16px #b75a3b1e}}\n.definition-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.definition-table th,.definition-table td{padding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"siem\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты / Mini SIEM</div><div class=\"eyebrow\">Security information & event management</div><h1>Mini <span class=\"text-accent\">SIEM.</span></h1><p>Работай с синтетическими событиями авторизации, endpoint, DNS и proxy. Фильтруй набор, ищи слова или используй простые поля, а затем открой событие и изучи контекст.</p><div class=\"page-tags\"><span class=\"pill accent\">DEMO DATA</span><span class=\"pill\">упрощённый query parser</span></div></div><div class=\"notice\"><strong>Синтаксис поиска:</strong> можно искать обычные слова или применять <code>user:a.ivanov</code>, <code>source:auth</code>, <code>severity:high</code>, <code>category:endpoint</code>, <code>type:AUTH_FAILURE</code>. Это учебный parser, не полный SPL или KQL.</div><div class=\"stats-row\" style=\"margin-bottom:17px\"><div class=\"stat\"><div class=\"stat-value\" id=\"siem-total\">12</div><div class=\"stat-label\">Событий</div></div><div class=\"stat\"><div class=\"stat-value text-red\" id=\"siem-high\">0</div><div class=\"stat-label\">High / Critical</div></div><div class=\"stat\"><div class=\"stat-value\" id=\"siem-shown\">12</div><div class=\"stat-label\">В выборке</div></div><div class=\"stat\"><div class=\"stat-value\" id=\"siem-review\">0</div><div class=\"stat-label\">Помечено к обзору</div></div></div><div class=\"toolbar\"><input class=\"field grow\" id=\"siem-query\" placeholder=\"Поиск: user:a.ivanov severity:high\"><select class=\"field select\" id=\"siem-category\"><option value=\"all\">Все источники</option><option value=\"auth\">Authentication</option><option value=\"endpoint\">Endpoint</option><option value=\"dns\">DNS</option><option value=\"network\">Network</option><option value=\"proxy\">Proxy</option></select><select class=\"field select\" id=\"siem-severity\"><option value=\"all\">Все уровни</option><option value=\"critical\">Critical</option><option value=\"high\">High</option><option value=\"medium\">Medium</option><option value=\"low\">Low</option></select><button class=\"btn primary small\" id=\"siem-search\">Поиск</button><button class=\"btn small\" id=\"siem-reset\">Сброс</button></div><div class=\"lab-layout\"><section class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Event stream</h3><span id=\"siem-count\">12 RESULTS</span></div><div class=\"table-wrap\" style=\"border:0;border-radius:0\"><table class=\"table\"><thead><tr><th>Time</th><th>Event ID</th><th>Source</th><th>Type</th><th>User</th><th>Severity</th></tr></thead><tbody id=\"siem-rows\"></tbody></table></div><div id=\"siem-empty\" class=\"empty-state hidden\">Нет событий для этих фильтров.</div></section><aside><div class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Event detail</h3><span id=\"detail-eventid\">SELECT EVENT</span></div><div class=\"lab-panel-body alert-detail\" id=\"siem-detail\"><div class=\"empty-state\">Выбери событие слева.</div></div></div><div class=\"lab-panel\" style=\"margin-top:14px\"><div class=\"lab-panel-head\"><h3>Query examples</h3><span>CLICK TO USE</span></div><div class=\"lab-panel-body\"><div class=\"query-examples\"><button data-sq=\"severity:high\">severity:high</button><button data-sq=\"user:a.ivanov\">user:a.ivanov</button><button data-sq=\"type:AUTH_FAILURE\">type:AUTH_FAILURE</button><button data-sq=\"powershell\">powershell</button><button data-sq=\"category:dns\">category:dns</button></div><div class=\"lesson-note\"><span>↳</span><p><b>Запрос — не вывод.</b> Сначала посмотри исходные строки, затем проверь, какие данные поддерживают гипотезу, а какие нужны дополнительно.</p></div></div></div></aside></div></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Теперь твой маршрут',text:'Начни с карты навыков, выполняй лабораторные задания и сохраняй результаты в портфолио. Демо безопасны и используют фиксированные синтетические данные.'}\n  ];\n  const key='guidedTour';let focus=null,dialog=null,resizeHandler=null;\n  function pageName(){return ((document.body.dataset.page||'index')+'.html').toLowerCase()}\n  function remove(){if(focus)focus.remove();if(dialog)dialog.remove();focus=null;dialog=null;if(resizeHandler)window.removeEventListener('resize',resizeHandler);document.querySelectorAll('[data-tour-active]').forEach(e=>e.removeAttribute('data-tour-active'))}\n  function end(){remove();store.set(key,null);}\n  function show(index){\n    remove(); if(index<0||index>=steps.length){end();return}\n    store.set(key,index); const step=steps[index];\n    if(pageName()!==step.page){parent.postMessage({type:'soc-atlas-route',page:step.page.replace(/\\.html$/i,''),hash:'',tourIndex:index},'*');return}\n    let target=$(step.selector);\n    if(!target){let next=index+1;show(next);return}\n    target.scrollIntoView({behavior:'smooth',block:'center'});target.setAttribute('data-tour-active','');\n    focus=document.createElement('div');focus.className='tour-focus';focus.setAttribute('aria-hidden','true');document.body.appendChild(focus);\n    dialog=document.createElement('section');dialog.className='tour-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Экскурсия по сайту');\n    dialog.innerHTML=`<div class=\"tour-kicker\">SOC ATLAS · GUIDED TOUR</div><h3>${step.title}</h3><p>${step.text}</p><div class=\"tour-actions\"><div class=\"left\"><button class=\"tour-dismiss\" data-tour-close>Завершить</button></div><span class=\"tour-counter\">${String(index+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><div class=\"right\">${index?'<button class=\"btn small ghost\" data-tour-prev>← Назад</button>':''}<button class=\"btn small primary\" data-tour-next>${index===steps.length-1?'Завершить':'Далее →'}</button></div></div>`;\n    document.body.appendChild(dialog);\n    function position(){let r=target.getBoundingClientR ype,e.user,e.srcip,e.host,e.message,e.desc].join(' ').toLowerCase().includes(rest)}function render(){let q=$('#siem-query').value,cat=$('#siem-category').value,sev=$('#siem-severity').value;filtered=data.filter(e=>match(e,q)&&(cat==='all'||e.category===cat)&&(sev==='all'||e.severity.toLowerCase()===sev));$('#siem-total').textContent=data.length;$('#siem-shown').textContent=filtered.length;$('#siem-count').textContent=filtered.length+' RESULTS';$('#siem-review').textContent=reviewed.size;$('#siem-high').textContent=data.filter(e=>['HIGH','CRITICAL'].includes(e.severity)).length;$('#siem-empty').classList.toggle('hidden',!!filtered.length);rows.innerHTML=filtered.map(e=>`<tr data-eid=\"${e.id}\" class=\"${current===e.id?'selected':''}\"><td class=\"mono-cell\">${e.time}</td><td class=\"mono-cell text-accent\">${e.id}</td><td>${esc(e.source)}</td><td>${esc(e.type)}</td><td>${esc(e.user)}</td><td><span class=\"table-badge ${['HIGH','CRITICAL'].includes(e.severity)?'badge-alert':e.severity==='MEDIUM'?'badge-warn':'badge-ok'}\">${e.severity}</span></td></tr>`).join('');if(filtered.length&&!filtered.some(e=>e.id===current))current=filtered[0].id;renderDetail()}function renderDetail(){let e=filtered.find(x=>x.id===current);$('#detail-eventid').textContent=e?e.id:'SELECT EVENT';let h=$('#siem-detail');if(!e){h.innerHTML='<div class=\"empty-state\">Нет выбранного события.</div>';return}h.innerHTML=`<span class=\"pill ${['HIGH','CRITICAL'].includes(e.severity)?'orange':''}\">${e.severity}</span><h2>${esc(e.type.replaceAll('_',' '))}</h2><p>${esc(e.message)}</p><div class=\"divider\"></div><div class=\"kv\"><span>Event ID</span><span>${e.id}</span><span>Time</span><span>${e.time} (demo)</span><span>Source</span><span>${esc(e.source)}</span><span>User</span><span>${esc(e.user)}</span><span>Host</span><span>${esc(e.host)}</span><span>Source IP</span><span>${esc(e.srcip)}</span><span>Category</span><span>${e.category}</span></div><div class=\"divider\"></div><h3>Analyst context</h var(--mono);fill:#24343d;text-anchor:middle}.connection-map .node .node-name{font:11px system-ui;fill:#596b75}\n@keyframes flowDash{to{stroke-dashoffset:-40}}\n.connection-list{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px}.connection-list h3{margin:0 0 11px;font-size:18px}.connection-list p{font-size:14px;line-height:1.8;color:var(--muted)}.conn-item{padding:12px 0;border-bottom:1px solid #dfe5e9}.conn-item:last-child{border-bottom:0}.conn-item button{display:block;background:transparent;border:0;text-align:left;color:#263842;width:100%;font:13px var(--mono);line-height:1.7}.conn-item button:hover{color:var(--accent)}.conn-item small{display:block;color:var(--muted);font:13px/1.7 var(--sans)}\n.theory-section{margin:52px 0}.theory-section h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.035em;margin:0 0 12px}.theory-section>p{max-width:950px;font-size:17px;line-height:1.9;color:#40525c}\n.concept-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.concept-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.concept-card .concept-num{color:var(--accent);font:13px var(--mono);margin-bottom:10px}.concept-card h3{font-size:19px;margin:0 0 9px}.concept-card p{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 11px}.concept-card .example{padding:12px;border-radius:9px;background:#f2f6e9;color:#3d5423;font-size:14px;line-height:1.8}\n.packet-anatomy{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.packet-anatomy div{min-height:93px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.packet-anatomy b{font-size:14px;display:block;margin-bottom:6px}.packet-anatomy span{font-size:13px;line-height:1.6;color:var(--muted)}\n.flow-demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch;margin:18px 0}.flow-demo .flowbox{padding:17px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}.flow-demo .flowbox b{font-size:16px;display:block}.flow-demo .flowbox span{font-size:14px;color:var(--muted);line-height:1.7;display:block;margin-top:5px}.flow-arrow{color:var(--accent);font-size:25px;align-self:center;text-align:center}\n.traffic-sim{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:22px 0}.traffic-sim h3{font-size:22px;margin:0 0 8px}.traffic-sim>p{font-size:15px;line-height:1.8;color:var(--muted)}.traffic-mode-row{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.traffic-metric{display:grid;grid-template-columns:130px minmax(0,1fr) 95px;gap:12px;align-items:center;margin:13px 0;font-size:14px}.traffic-track{height:18px;background:#e7ecef;border-radius:99px;overflow:hidden}.traffic-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a3d359,#6f9d20);transition:width .9s cubic-bezier(.2,.8,.2,1)}.traffic-fill.warn{background:linear-gradient(90deg,#f6c36d,#c25d45)}.traffic-metric strong{font:13px var(--mono);text-align:right}.traffic-outcome{padding:15px;border-radius:10px;background:#f1f6e6;border:1px solid #d3e4b6;color:#435c25;font-size:15px;line-height:1.8;margin-top:16px}.traffic-sources{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.traffic-source{border:1px solid #e5b6a4;background:#fff3ed;color:#8d442f;border-radius:7px;padding:8px 10px;font:12px var(--mono);animation:sourcePulse 1.4s ease-in-out infinite alternate}@keyframes sourcePulse{to{transform:translateY(-3px);box-shadow:0 6px 16px #b75a3b1e}}\n.definition-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.definition-table th,.definition-table td{padding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"cases\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты / Case Room</div><div class=\"eyebrow\">Investigation workflow</div><h1>Case <span class=\"text-accent\">Room.</span></h1><p>Учебный кейс от первичного алерта до передачи в Incident Response. Собери таймлайн и выбери следующий шаг. Главное — обосновать действия и явно обозначить неизвестные факты.</p></div><div class=\"grid two\"><div class=\"card\"><span class=\"pill orange\">CASE SOC-TRN-014</span><h3 style=\"margin-top:15px\">Подозрительная цепочка входа и endpoint activity</h3><p>В коротком окне обнаружены множественные ошибки входа, последующий успешный вход, PowerShell от почтового клиента и создание задания на WS-017.</p><div class=\"tag-list\"><span class=\"tag\">identity</span><span class=\"tag\">endpoint</span><span class=\"tag\">DNS</span><span class=\"tag\">scheduled task</span></div></div><div class=\"card\"><div class=\"eyebrow\">Current status</div><div class=\"big-number text-orange\" id=\"case-status\">OPEN</div><p id=\"case-status-desc\">Собери факты и сформулируй scope. Решение должно опираться на критерии.</p><div class=\"divider\"></div><div class=\"metric-line\"><span>Evidence items</span><b id=\"evidence-count\">0 / 5 reviewed</b></div><div class=\"metric-line\"><span>Timeline</span><b>14:41–14:50</b></div></div></div><section class=\"section\" style=\"padding-bottom:20px\"><div class=\"section-head\"><div><div class=\"eyebrow\">Evidence board</div><h2>Материалы дела</h2><p>Открой каждый элемент и отметь, что он поддерживает и чего не доказывает.</p></div></div><div class=\"grid two\" id=\"case-evidence\"></div></section><section class=\"section\" style=\"padding-top:20px\"><div class=\"section-head\"><div><div class=\"eyebrow\">Decision point</div><h2>Что будешь делать дальше?</h2><p>Решение должно быть безопасным и процедурным.</p></div></div><div class=\"grid three\"><button class=\"card\" data-decision=\"close\"><div class=\"card-icon\">×</div><h3>Закрыть как false positive</h3><p>Считать всё легитимным без дополнительных проверок.</p></button><button class=\"card\" data-decision=\"escalate\"><div class=\"card-icon\">↗</div><h3>Эскалировать с доказательствами</h3><p>Передать старшему аналитику таймлайн, scope и пробелы в данных.</p></button><button class=\"card\" data-decision=\"block\"><div class=\"card-icon\">▣</div><h3>Самостоятельно блокировать</h3><p>Изменить инфраструктуру до проверки полномочий и процедуры.</p></button></div><div id=\"decision-feedback\" class=\"notice hidden\" style=\"margin-top:16px\"></div></section><section class=\"section\" style=\"padding-top:20px\"><div class=\"section-head\"><div><div class=\"eyebrow\">Handoff template</div><h2>Передача старшему аналитику</h2></div></div><div class=\"card\"><label style=\"display:block;font-size:11px;color:var(--muted);margin-bottom:6px\">Краткое резюме</label><textarea id=\"handoff-summary\" class=\"field\" style=\"width:100%;min-height:75px;resize:vertical\" placeholder=\"Что произошло? Какой актив затронут?\"></textarea><label style=\"display:block;font-size:11px;color:var(--muted);margin:12px 0 6px\">Факты и неизвестные данные</label><textarea id=\"handoff-evidence\" class=\"field\" style=\"width:100%;min-height:110px;resize:vertical\" placeholder=\"Факты со временем и источниками; что ещё нужно проверить...\"></textarea><div class=\"actions\"><button class=\"btn primary\" id=\"handoff-copy\">Скопировать handoff</button><button class=\"btn\" id=\"handoff-template\">Вставить шаблон</button></div></div></section></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить adding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"detection\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты / Detection Studio</div><div class=\"eyebrow\">Detection engineering · fundamentals</div><h1>Detection <span class=\"text-accent\">Studio.</span></h1><p>Собери учебное правило для серии ошибок входа с последующим успехом. Настрой порог и временное окно, проверь синтетические результаты и опиши ограничения.</p></div><div class=\"lab-layout\"><section class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Rule builder</h3><span>AUTHENTICATION BEHAVIOR</span></div><div class=\"lab-panel-body\"><label style=\"font-size:10px;color:var(--muted)\">Название правила</label><input class=\"field\" id=\"det-name\" style=\"width:100%;margin:6px 0 14px\" value=\"Multiple failed logons followed by success\"><div class=\"grid two\"><div><label style=\"font-size:10px;color:var(--muted)\">Порог неудач</label><select class=\"field\" id=\"det-threshold\" style=\"width:100%;margin-top:6px\"><option value=\"3\">3 и более</option><option value=\"5\" selected>5 и более</option><option value=\"8\">8 и более</option></select></div><div><label style=\"font-size:10px;color:var(--muted)\">Временное окно</label><select class=\"field\" id=\"det-window\" style=\"width:100%;margin-top:6px\"><option value=\"60\">1 минута</option><option value=\"180\" selected>3 минуты</option><option value=\"600\">10 минут</option></select></div></div><div class=\"divider\"></div><label style=\"font-size:10px;color:var(--muted)\">Техническая логика (псевдо-SQL)</label><pre class=\"terminal-output\" style=\"height:auto;border:1px solid var(--line);border-radius:9px;margin:7px 0 12px;background:#080a0b;color:var(--accent)\">SELECT user, source_ip, count(*) AS failures\nFROM auth_events\nWHERE outcome = 'failure'\nGROUP BY user, source_ip, time_window\nHAVING failures >= threshold\nAND EXISTS(success_after_failure)</pre><label style=\"font-size:10px;color:var(--muted)\">Исключения / tuning notes</label><textarea id=\"det-exclusions\" class=\"field\" style=\"width:100%;min-height:83px;margin-top:6px;resize:vertical\" placeholder=\"Обоснованные исключения и владельцы источников...\"></textarea><button class=\"btn primary\" id=\"det-run\" style=\"margin-top:14px\">▶ Проверить на данных</button></div></section><aside class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Rule status</h3><span>LOCAL ONLY</span></div><div class=\"lab-panel-body\"><span class=\"pill accent\" id=\"det-state\">DRAFT</span><div class=\"big-number\" id=\"det-matches\" style=\"margin-top:12px\">—</div><p style=\"font-size:11px;color:var(--muted)\">совпадений в учебных данных</p><div class=\"divider\"></div><div class=\"metric-line\"><span>Источник данных</span><b>AUTH LOGS</b></div><div class=\"metric-line\"><span>False positives</span><b>Проверить</b></div><div class=\"metric-line\"><span>False negatives</span><b>Проверить</b></div><div id=\"det-result\" class=\"lesson-note\"><span>i</span><p><b>Rule ≠ incident.</b> Правило выделяет поведение, а не доказывает злой умысел.</p></div></div></aside></div><section class=\"section\"><div class=\"grid two\"><div class=\"card\"><h3>Обоснование</h3><p>Серия неудачных входов с последующим успехом может соответствовать атаке на учётную запись. Окно и порог должны учитывать baseline среды и поведение легитимных сервисов.</p></div><div class=\"card\"><h3>Тестирование</h3><p>Проверь позитивные примеры, обычную автоматизацию, дубликаты и неполные источники. Задокументируй поля, ограничения и процедуру разбора.</p></div></div></section></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Теперь твой маршрут',text:'Начни с карты навыков, выполняй лабораторные задания и сохраняй результаты в портфолио. Демо безопасны и используют фиксированные синтетические данные.'}\n  ];\n  const key='guidedTour';let focus=null,dialog=null,resizeHandler=null;\n  function pageName(){return ((document.body.dataset.page||'index')+'.html').toLowerCase()}\n  function remove(){if(focus)focus.remove();if(dialog)dialog.remove();focus=null;dialog=null;if(resizeHandler)window.removeEventListener('resize',resizeHandler);document.querySelectorAll('[data-tour-active]').forEach(e=>e.removeAttribute('data-tour-active'))}\n  function end(){remove();store.set(key,null);}\n  function show(index){\n    remove(); if(index<0||index>=steps.length){end();return}\n    store.set(key,index); const step=steps[index];\n    if(pageName()!==step.page){parent.postMessage({type:'soc-atlas-route',page:step.page.replace(/\\.html$/i,''),hash:'',tourIndex:index},'*');return}\n    let target=$(step.selector);\n    if(!target){let next=index+1;show(next);return}\n    target.scrollIntoView({behavior:'smooth',block:'center'});target.setAttribute('data-tour-active','');\n    focus=document.createElement('div');focus.className='tour-focus';focus.setAttribute('aria-hidden','true');document.body.appendChild(focus);\n    dialog=document.createElement('section');dialog.className='tour-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Экскурсия по сайту');\n    dialog.innerHTML=`<div class=\"tour-kicker\">SOC ATLAS · GUIDED TOUR</div><h3>${step.title}</h3><p>${step.text}</p><div class=\"tour-actions\"><div class=\"left\"><button class=\"tour-dismiss\" data-tour-close>Завершить</button></div><span class=\"tour-counter\">${String(index+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><div class=\"right\">${index?'<button class=\"btn small ghost\" data-tour-prev>← Назад</button>':''}<button class=\"btn small primary\" data-tour-next>${index===steps.length-1?'Завершить':'Далее →'}</button></div></div>`;\n    document.body.appendChild(dialog);\n    function position(){let r=target.getBoundingClientRect(),pad=5;focus.style.left=Math.max(5,r.left-pad)+'px';focus.style.top=Math.max(5,r.top-pad)+'px';focus.style.width=Math.min(window.innerWidth-10,r.width+pad*2)+'px';focus.style.height=Math.min(window.innerHeight-10,r.height+pad*2)+'px'}\n    position();resizeHandler=position;window.addEventListener('resize',resizeHandler);\n    dialog.querySelector('[data-tour-clo nt:12px var(--mono);animation:sourcePulse 1.4s ease-in-out infinite alternate}@keyframes sourcePulse{to{transform:translateY(-3px);box-shadow:0 6px 16px #b75a3b1e}}\n.definition-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.definition-table th,.definition-table td{padding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"endpoint\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты / Endpoint Lab</div><div class=\"eyebrow\">Endpoint detection & response</div><h1>Endpoint <span class=\"text-accent\">Timeline.</span></h1><p>Посмотри на цепочку Windows-событий: учётная запись, родительский процесс, командная строка, сетевое событие и scheduled task. Всё содержимое синтетическое и только для чтения.</p></div><div class=\"notice\"><strong>Учебная телеметрия:</strong> команды в примерах не исполняются. Смотри на родительский процесс, пользователя, полный путь, временную последовательность и соседние события.</div><div class=\"toolbar\"><select class=\"field select\" id=\"ep-filter\"><option value=\"all\">Все типы событий</option><option value=\"process\">Process start</option><option value=\"auth\">Logon</option><option value=\"task\">Scheduled task</option><option value=\"network\">Network</option></select><input class=\"field grow\" id=\"ep-search\" placeholder=\"Поиск по процессу, пользователю, событию...\"></div><div class=\"lab-layout\"><section class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Host: WS-017</h3><span>WINDOWS EVENT TIMELINE · EXAMPLE</span></div><div class=\"lab-panel-body\"><div id=\"endpoint-timeline\" class=\"timeline\"></div></div></section><aside><div class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Выбранное событие</h3><span id=\"ep-id\">SELECT</span></div><div class=\"lab-panel-body\" id=\"ep-detail\"><div class=\"empty-state\">Нажми событие в таймлайне.</div></div></div><div class=\"lab-panel\" style=\"margin-top:14px\"><div class=\"lab-panel-head\"><h3>Мини-задание</h3><span>ANALYST TASK</span></div><div class=\"lab-panel-body\"><p style=\"color:var(--muted);font-size:11px\">Какая гипотеза лучше объясняет цепочку?</p><button class=\"btn small\" data-answer=\"a\" style=\"width:100%;margin:4px 0;text-align:left;justify-content:flex-start\">A. Обычное обновление без дополнительных проверок</button><button class=\"btn small\" data-answer=\"b\" style=\"width:100%;margin:4px 0;text-align:left;justify-content:flex-start\">B. Подозрительная цепочка Office → PowerShell → DNS → task требует проверки</button><button class=\"btn small\" data-answer=\"c\" style=\"width:100%;margin:4px 0;text-align:left;justify-content:flex-start\">C. Компрометация доказана, хост надо немедленно отключить</button><div id=\"ep-feedback\" class=\"quiz-feedback hidden\"></div></div></div></aside></div></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progre e-columns:130px minmax(0,1fr) 95px;gap:12px;align-items:center;margin:13px 0;font-size:14px}.traffic-track{height:18px;background:#e7ecef;border-radius:99px;overflow:hidden}.traffic-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a3d359,#6f9d20);transition:width .9s cubic-bezier(.2,.8,.2,1)}.traffic-fill.warn{background:linear-gradient(90deg,#f6c36d,#c25d45)}.traffic-metric strong{font:13px var(--mono);text-align:right}.traffic-outcome{padding:15px;border-radius:10px;background:#f1f6e6;border:1px solid #d3e4b6;color:#435c25;font-size:15px;line-height:1.8;margin-top:16px}.traffic-sources{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.traffic-source{border:1px solid #e5b6a4;background:#fff3ed;color:#8d442f;border-radius:7px;padding:8px 10px;font:12px var(--mono);animation:sourcePulse 1.4s ease-in-out infinite alternate}@keyframes sourcePulse{to{transform:translateY(-3px);box-shadow:0 6px 16px #b75a3b1e}}\n.definition-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.definition-table th,.definition-table td{padding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"phishing\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты / Phishing Analyzer</div><div class=\"eyebrow\">Email triage · interactive demo</div><h1>Phishing <span class=\"text-accent\">Analyzer.</span></h1><p>Изучи три учебных письма. Кликни по подозрительным элементам, чтобы увидеть объяснение. Ни один отдельный признак автоматически не доказывает фишинг.</p></div><div class=\"notice warn\"><strong>Безопасность:</strong> домены и ссылки вымышлены. Не открывай подозрительные ссылки из реальных писем; проверяй их через разрешённые инструменты и по процедуре.</div><div class=\"score-bar\"><span class=\"tagline\">CLUES FOUND</span><strong id=\"phish-score\">0 / 0</strong><div class=\"progress-track\"><div class=\"progress-fill\" id=\"phish-fill\"></div></div><button class=\"btn small\" id=\"phish-reset\">Сбросить</button></div><div class=\"mail-layout\"><aside class=\"mail-list\" id=\"mail-list\"></aside><section class=\"email-view\" id=\"email-view\"></section></div><section class=\"section\" style=\"padding-bottom:0\"><div class=\"section-head\"><div><div class=\"eyebrow\">Checklist</div><h2>Что проверить в работе</h2></div></div><div class=\"grid two\"><div class=\"card\"><h3>Технические признаки</h3><p>From / Reply-To / Return-Path, SPF/DKIM/DMARC, домен и редиректы URL, вложения, message ID, timestamp и репутация через одобренные сервисы.</p></div><div class=\"card\"><h3>Контекст и действие</h3><p>Кто получил письмо, кликал ли пользователь, запускался ли процесс и были ли входы после клика. Сохраняй артефакты по процедуре; эскалируй при признаках исполнения.</p></div></div></section></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Теперь твой маршрут',text:'Начни с карты навыков, выполняй лабораторные задания и сохраняй результаты в портфолио. Демо безопасны и используют фиксированные синтетические данные.'}\n  ];\n  const key='guidedTour';let focus=null,dialog=null,resizeHandler=null;\n  function pageName(){return ((document.body.dataset.page||'index')+'.html').toLowerCase()}\n  function remove(){if(focus)focus.remove();if(dialog)dialog.remove();focus=null;dialog=null;if(resizeHandler)window.removeEventListener('resize',resizeHandler);document.querySelectorAll('[data-tour-active]').forEach(e=>e.removeAttribute('data-tour-active'))}\n  function end(){remove();store.set(key,null);}\n  function show(index){\n    remove(); if(index<0||index>=steps.length){end();return}\n    store.set(key,index); const step=steps[index];\n    if(pageName()!==step.page){parent.postMessage({type:'soc-atlas-route',page:step.page.replace(/\\.html$/i,''),hash:'',tourIndex:index},'*');return}\n    let target=$(step.selector);\n    if(!target){let next=index+1;show(next);return}\n    target.scrollIntoView({behavior:'smooth',block:'center'});target.setAttribute('data-tour-active','');\n    focus=document.createElement('div');focus.className='tour-focus';focus.setAttribute('aria-hidden','true');document.body.appendChild(focus);\n    dialog=document.createElement('section');dialog.className='tour-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Экскурсия по сайту');\n    dialog.innerHTML=`<div class=\"tour-kicker\">SOC ATLAS · GUIDED TOUR</div><h3>${step.title}</h3><p>${step.text}</p><div class=\"tour-actions\"><div class=\"left\"><button class=\"tour-dismiss\" data-tour-close>Завершить</button></div><span class=\"tour-counter\">${String(index+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><div class=\"right\">${index?'<button class=\"btn small ghost\" data-tour-prev>← Назад</button>':''}<button class=\"btn small primary\" data-tour-next>${index===steps.length-1?'Завершить':'Далее →'}</button></div></div>`;\n    document.body.appendChild(dialog);\n    function position(){let r=target.getBoundingClientRect(),pad=5;focus.style.left=Math.max(5,r.left-pad)+'px';focus.style.top=Math.max(5,r.top-pad)+'px';focus.style.width=Math.min(window.innerWidth-10,r.width+pad*2)+'px';focus.style.height=Math.min(window.innerHeight-10,r.height+pad*2)+'px'}\n    position();resizeHandler=position;window.addEventListener('resize',resizeHandler);\n    dialog.querySelector('[data-tour-close]').onclick=end;\n    dialog.querySelector('[data-tour-next]').onclick=()=>show(index+1);\n    const prev=dialog.querySelector('[data-tour-prev]');if(prev)prev.onclick=()=>show(index-1);\n  }\n  const start=$('[data-tour-start]');if(start)start.addEventListener('click',()=>show(0));\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focus)end()});\n  const saved=store.get(key,null);\n  window.addEventListener('message',ev=>{if(ev.data?.type==='soc-atlas-tour-resume'&&Number.isInteger(ev.data.index))show(ev.data.index)});if(new URLSearchParams(location.search).has('tour')&&Number.isInteger(saved))show(saved);\n  window.setTimeout(()=>{const orphan=document.querySelector('.tour-focus');if(orphan&&!document.querySelector('.tour-dialog'))orphan.remove();},1800); // socatlas-tour-safety\n})();\n\n<\/script><script>\nwindow.SOC_PHISH=[\n{id:'mail1',sender:'IT Service Desk <support@identity-check.training.invalid>',to:'user@company.example',subject:'Требуется повторная проверка доступа сегодня',time:'10:14',intro:'Здравствуйте!',body:[['p','В рамках обновления доступа необходимо подтвердить данные учётной записи до конца рабочего дня.'],['flag','Нажмите здесь, чтобы подтвердить доступ: https://identity-check.training.invalid/verify'],['p','В противном случае доступ к корпоративной почте будет временно ограничен.'],['p','С уважением, IT Service Desk']],clues:[{text:'support@identity-check.training.invalid',why:'Домен не совпадает с ожидаемым корпоративным доменом. Сверь его с официальным источником, не полагайся на отображаемое имя.'},{text:'Нажмите здесь, чтобы подтвердить доступ: https://identity-check.training.invalid/verify',why:'Ссылка ведёт в учебную зону. В реальном кейсе проверяй полный URL и редиректы безопасным инструментом, не кликая по ссылке.'},{text:'доступ к корпоративной почте будет временно ограничен',why:'Срочность и угроза потери доступа — распространённый способ давления, но сами по себе не доказывают фишинг.'}]},\n{id:'mail2',sender:'People Operations <people@company.example>',to:'user@company.example',subject:'Напоминание: обновление расписания отпуска',time:'11:32',intro:'Добрый день!',body:[['p','График отпусков на следующий квартал доступен во внутреннем портале.'],['p','Откройте портал обычной закладкой в браузере или адресом из корпоративного справочника.'],['p','При вопросах создайте тикет в знакомом Service Desk.'],['p','Команда People Operations']],clues:[],why:'В примере нет явных учебных признаков фишинга. Это не доказывает безопасность письма: при необходимости проверь заголовки, контекст и аутентификацию.'},\n{id:'mail3',sender:'Finance Desk <finance@company.example> via bulk-send.training.invalid',to:'user@company.example',subject:'Invoice 4812 — review document',time:'13:07',intro:'Hello,',body:[['p','Please
