n-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head><body data-page=\"tools\"><header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header><main class=\"wrap\"><div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты</div><div class=\"eyebrow\">Инструментарий SOC</div><h1>Маленький стенд.<br><span class=\"text-accent\">Большая практика.</span></h1><p>Интерфейсы ниже — локальные учебные симуляторы, не настоящие корпоративные продукты и не подключение к живой сети.</p><div class=\"page-tags\"><span class=\"pill accent\">SYNTHETIC DATA</span><span class=\"pill\">без аккаунта</span><span class=\"pill\">без реальных подключений</span></div></div><div class=\"tool-grid\"><article class=\"tool-card reveal\"><div class=\"tool-top\"><span class=\"tool-logo\">⌁</span><span class=\"pill blue\">NETWORK</span></div><h3>Packet Explorer</h3><p>Таблица пакетов, display filters, уровни Ethernet/IP/TCP/DNS/TLS и синтетический сетевой поток.</p><a class=\"btn small\" href=\"lab-wireshark.html\">Открыть Packet Lab →</a></article><article class=\"tool-card reveal\"><div class=\"tool-top\"><span class=\"tool-logo\">▦</span><span class=\"pill blue\">SIEM</span></div><h3>Mini SIEM</h3><p>Поиск по auth, endpoint, DNS и proxy; фильтры, детали события и analyst context.</p><a class=\"btn small\" href=\"siem.html\">Открыть SIEM →</a></article><article class=\"tool-card reveal\"><div class=\"tool-top\"><span class=\"tool-logo\">◉</span><span class=\"pill blue\">ENDPOINT</span></div><h3>Endpoint Timeline</h3><p>Windows-события, родительские процессы, командная строка и учебная цепочка расследования.</p><a class=\"btn small\" href=\"endpoint.html\">Открыть Endpoint Lab →</a></article><article class=\"tool-card reveal\"><div class=\"tool-top\"><span class=\"tool-logo\">✉</span><span class=\"pill blue\">EMAIL</span></div><h3>Phishing Analyzer</h3><p>Находи признаки в sender, домене, URL, вложении и контексте письма.</p><a class=\"btn small\" href=\"phishing.html\">Открыть анализатор →</a></article><article class=\"tool-card reveal\"><div class=\"tool-top\"><span class=\"tool-logo\">◎</span><span class=\"pill blue\">INCIDENT RESPONSE</span></div><h3>Case Room</h3><p>Evidence board, временная шкала, варианты решений и handoff старшему аналитику.</p><a class=\"btn small\" href=\"cases.html\">Открыть кейсы →</a></article><article class=\"tool-card reveal\"><div class=\"tool-top\"><span class=\"tool-logo\">⌕</span><span class=\"pill blue\">DETECTION</span></div><h3>Detection Studio</h3><p>Настрой порог и временное окно, проверь учебное правило и опиши ограничения детекта.</p><a class=\"btn small\" href=\"detection.html\">Открыть Detection Studio →</a></article></div><div class=\"notice warn\" style=\"margin-top:22px\"><strong>Ограничения:</strong> Packet Explorer не перехватывает live-трафик и не открывает pcap-файлы; Mini SIEM не подключён к настоящей платформе. Это упражнения для освоения логики.</div></main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Синтетические данные · не подключено к реальной сети</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Теперь твой маршрут',text:'Начни с карты навыков, выполняй лабораторные задания и сохраняй результаты в портфолио. Демо безопасны и используют фиксированные синтетические данные.'}\n  ];\n  const key='guidedTour';let focus=null,dialog=null,resizeHandler=null;\n  function pageName(){return ((document.body.dataset.page||'index')+'.html').toLowerCase()}\n  function remove(){if(focus)focus.remove();if(dialog)dialog.remove();focus=null;dialog=null;if(resizeHandler)window.removeEventListener('resize',resizeHandler);document.querySelectorAll('[data-tour-active]').forEach(e=>e.removeAttribute('data-tour-active'))}\n  function end(){remove();store.set(key,null);}\n  function show(index){\n    remove(); if(index<0||index>=steps.length){end();return}\n    store.set(key,index); const step=steps[index];\n    if(pageName()!==step.page){parent.postMessage({type:'soc-atlas-route',page:step.page.replace(/\\.html$/i,''),hash:'',tourIndex:index},'*');return}\n    let target=$(step.selector);\n    if(!target){let next=index+1;show(next);return}\n    target.scrollIntoView({behavior:'smooth',block:'center'});target.setAttribute('data-tour-active','');\n    focus=document.createElement('div');focus.className='tour-focus';focus.setAttribute('aria-hidden','true');document.body.appendChild(focus);\n    dialog=document.createElement('section');dialog.className='tour-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Экскурсия по сайту');\n    dialog.innerHTML=`<div class=\"tour-kicker\">SOC ATLAS · GUIDED TOUR</div><h3>${step.title}</h3><p>${step.text}</p><div class=\"tour-actions\"><div class=\"left\"><button class=\"tour-dismiss\" data-tour-close>Завершить</button></div><span class=\"tour-counter\">${String(index+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><div class=\"right\">${index?'<button class=\"btn small ghost\" data-tour-prev>← Назад</button>':''}<button class=\"btn small primary\" data-tour-next>${index===steps.length-1?'Завершить':'Далее →'}</button></div></div>`;\n    document.body.appendChild(dialog);\n    function position(){let r=target.getBoundingClientRect(),pad=5;focus.style.left=Math.max(5,r.left-pad)+'px';focus.style.top=Math.max(5,r.top-pad)+'px';focus.style.width=Math.min(window.innerWidth-10,r.width+pad*2)+'px';focus.style.height=Math.min(window.innerHeight-10,r.height+pad*2)+'px'}\n    position();resizeHandler=position;window.addEventListener('resize',resizeHandler);\n    dialog.querySelector('[data-tour-close]').onclick=end;\n    dialog.querySelector('[data-tour-next]').onclick=()=>show(index+1);\n    const prev=dialog.querySelector('[data-tour-prev]');if(prev)prev.onclick=()=>show(index-1);\n  }\n  const start=$('[data-tour-start]');if(start)start.addEventListener('click',()=>show(0));\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focus)end()});\n  const saved=store.get(key,null);\n  window.addEventListener('message',ev=>{if(ev.data?.type==='soc-atlas-tour-resume'&&Number.isInteger(ev.data.index))show(ev.data.index)});if(new URLSearchParams(location.search).has('tour')&&Number.isInteger(saved))show(saved);\n  window.setTimeout(()=>{const orphan=document.querySelector('.tour-focus');if(orphan&&!document.querySelector('.tour-dialog'))orphan.remove();},1800); // socatlas-tour-safety\n})();\n\n<\/script><script>\n(()=>{\n const allowed=new Set(['index','roadmap','academy','tools','lab-wireshark','siem','cases','detection','endpoint','phishing','interview']);\n document.addEventListener('click',ev=>{\n   const a=ev.target.closest('a[href]'); if(!a||ev.defaultPrevented||a.target||a.hasAttribute('download'))return;\n   const href=a.getAttribute('href'); if(!href||/^(https?:|mailto:|tel:|javascript:|#)/i.test(href))return;\n   const m=href.match(/^([^?#]+\\.html)(?:\\?([^#]*))?(?:#(.*))?$/i); if(!m)return;\n   const key=m[1].split('/').pop().replace(/\\.html$/i,'').toLowerCase(); if(!allowed.has(key))return;\n   ev.preventDefault(); const qs=new URLSearchParams(m[2]||''); parent.postMessage({type:'soc-atlas-route',page:key,hash:m[3]||'',tour:qs.has('tour')},'*');\n });\n window.addEventListener('message',ev=>{\n   if(ev.data?.type==='soc-atlas-tour-resume'&&Number.isInteger(ev.data.index)){\n     window.dispatchEvent(new MessageEvent('message',{data:ev.data}));\n   }\n });\n})();\n<\/script>\n</body></html>","lab-wireshark":"<!doctype html><html lang=\"ru\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#edf1f3\"><title>Network Lab — SOC Atlas</title><style>\n:root{--bg:#edf1f3;--panel:#ffffff;--panel2:#f4f6f8;--line:#d1d9df;--text:#202a31;--muted:#56656f;--subtle:#737f88;--accent:#70991f;--blue:#276abb;--orange:#a86611;--red:#b83636;--green:#287642;--radius:18px;--mono:'DM Mono',ui-monospace,Consolas,monospace;--sans:'Manrope',Inter,system-ui,sans-serif;--shadow:0 24px 70px #2939451a}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 var(--sans);overflow-x:hidden}body:before{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:-2;background-image:linear-gradient(#26364006 1px,transparent 1px),linear-gradient(90deg,#26364006 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,# argin-bottom:10px}.concept-card h3{font-size:19px;margin:0 0 9px}.concept-card p{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 11px}.concept-card .example{padding:12px;border-radius:9px;background:#f2f6e9;color:#3d5423;font-size:14px;line-height:1.8}\n.packet-anatomy{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.packet-anatomy div{min-height:93px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.packet-anatomy b{font-size:14px;display:block;margin-bottom:6px}.packet-anatomy span{font-size:13px;line-height:1.6;color:var(--muted)}\n.flow-demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch;margin:18px 0}.flow-demo .flowbox{padding:17px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}.flow-demo .flowbox b{font-size:16px;display:block}.flow-demo .flowbox span{font-size:14px;color:var(--muted);line-height:1.7;display:block;margin-top:5px}.flow-arrow{color:var(--accent);font-size:25px;align-self:center;text-align:center}\n.traffic-sim{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:22px 0}.traffic-sim h3{font-size:22px;margin:0 0 8px}.traffic-sim>p{font-size:15px;line-height:1.8;color:var(--muted)}.traffic-mode-row{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.traffic-metric{display:grid;grid-template-columns:130px minmax(0,1fr) 95px;gap:12px;align-items:center;margin:13px 0;font-size:14px}.traffic-track{height:18px;background:#e7ecef;border-radius:99px;overflow:hidden}.traffic-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a3d359,#6f9d20);transition:width .9s cubic-bezier(.2,.8,.2,1)}.traffic-fill.warn{background:linear-gradient(90deg,#f6c36d,#c25d45)}.traffic-metric strong{font:13px var(--mono);text-align:right}.traffic-outcome{padding:15px;border-radius:10px;background:#f1f6e6;border:1px solid #d3e4b6;color:#435c25;font-size:15px;line-height:1.8;margin-top:16px}.traffic-sources{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.traffic-source{border:1px solid #e5b6a4;background:#fff3ed;color:#8d442f;border-radius:7px;padding:8px 10px;font:12px var(--mono);animation:sourcePulse 1.4s ease-in-out infinite alternate}@keyframes sourcePulse{to{transform:translateY(-3px);box-shadow:0 6px 16px #b75a3b1e}}\n.definition-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.definition-table th,.definition-table td{padding:13px 15px;border-bottom:1px solid #e0e6e9;text-align:left;font-size:15px;vertical-align:top}.definition-table th{background:#f1f4f5;font-weight:800}.definition-table td:first-child{font-weight:800;width:180px}\n@media(max-width:900px){.packet-lab-grid,.connection-layout{grid-template-columns:1fr}.concept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-quickstart{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:600px){body{font-size:15px}.page-head p,.lead,.lab-intro{font-size:16px!important}.concept-grid,.flow-demo{grid-template-columns:1fr}.packet-anatomy{grid-template-columns:1fr}.traffic-metric{grid-template-columns:100px minmax(0,1fr) 75px;gap:8px}.terminal-output{height:210px;font-size:12px}.terminal-input-row{gap:6px}.terminal-input-row label{font-size:11px}.connection-map{min-height:280px}.connection-map svg{min-height:270px}}\n\n</style></head>\n<body data-page=\"lab-wireshark\">\n<header class=\"topbar\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-mark\">⌁</span><span>SOC ATLAS<small>SECURITY OPERATIONS / LEARNING OS</small></span></a><button class=\"mobile-toggle\" aria-label=\"Открыть меню\">☰</button><nav class=\"nav\"><a href=\"index.html\">Обзор</a><a href=\"roadmap.html\">Маршрут</a><a href=\"academy.html\">Обучение</a><a href=\"tools.html\">Инструменты</a><a class=\"active\" href=\"lab-wireshark.html\">Packet Lab</a><a href=\"siem.html\">SIEM</a><a href=\"cases.html\">Кейсы</a></nav><div class=\"top-right\"><span class=\"status-live\"><i class=\"pulse-dot\"></i> TRAINING ENV</span></div></header>\n<main class=\"wrap\">\n  <div class=\"page-head\"><div class=\"breadcrumbs\"><a href=\"index.html\">Обзор</a> / Инструменты / Сетевой анализ</div><div class=\"eyebrow\">INTERACTIVE NETWORK FORENSICS</div><h1>Сеть без магии: <span class=\"text-accent\">Packet Lab.</span></h1><p class=\"lab-intro\">Представь, что сеть — это система доставки. Пакеты — посылки, IP-адреса — адреса отправителя и получателя, порты — конкретные службы. Здесь можно смотреть, как устройства общаются, раскрывать детали пакетов и вводить команды в учебную консоль.</p><div class=\"page-tags\"><span class=\"pill accent\">СИНТЕТИЧЕСКИЙ ТРАФИК</span><span class=\"pill\">IP · TCP · UDP · DNS · TLS · HTTP</span><span class=\"pill\">БЕЗ ПОДКЛЮЧЕНИЯ К СЕТИ</span></div></div>\n  <div class=\"notice warn\"><strong>Важное ограничение.</strong> Эта лаборатория не перехватывает данные реальных людей, не определяет владельца произвольного IP и не блокирует адреса в операционной системе. Все адреса и команды работают только внутри симуляции. В реальности анализировать разрешается лишь тот трафик, на который у тебя есть полномочия; HTTPS обычно скрывает содержимое данных от наблюдателя сети.</div>\n  <div class=\"lab-quickstart\">\n    <article><b>1. Запусти захват</b><p>Появятся учебные пакеты. Новые строки будут поступать постепенно, а адреса и направления будут меняться.</p></article>\n    <article><b>2. Выбери пакет</b><p>Нажми строку в таблице. Внизу раскроются уровни: Ethernet, IP, TCP/UDP и данные прикладного протокола.</p></article>\n    <article><b>3. Поговори с консолью</b><p>Команда <code>help</code> покажет список. Попробуй <code>ip 10.10.5.24</code>, <code>trace 198.51.100.77</code> или <code>connections</code>.</p></article>\n  </div>\n  <div class=\"capture-bar\"><button class=\"btn primary\" id=\"capture-start\">▶ Начать учебный захват</button><button class=\"btn\" id=\"capture-stop\" disabled>Ⅱ Пауза</button><button class=\"btn\" id=\"capture-reset\">↺ Сбросить</button><span class=\"capture-state\"><i id=\"capture-led\" class=\"state-led\"></i><span id=\"capture-status\">ГОТОВ К ЗАПУСКУ</span></span></div>\n  <div class=\"packet-lab-grid\" style=\"margin-top:16px\">\n    <section class=\"lab-panel\">\n      <div class=\"lab-panel-head\"><h3>Список пакетов</h3><span><b id=\"packet-count\">0</b> показано · <span id=\"packet-total\">0</span> всего</span></div>\n      <div class=\"lab-control-row\"><input id=\"packet-filter\" class=\"field grow\" aria-label=\"Фильтр пакетов\" placeholder=\"Фильтр: dns · tcp.port == 443 · ip.addr == 10.10.5.24\"><button id=\"filter-apply\" class=\"btn small\">Применить</button><button id=\"filter-clear\" class=\"btn small\">Очистить</button></div>\n      <div class=\"filter-chips\"><button data-pfilter=\"dns\">dns</button><button data-pfilter=\"tcp.port == 443\">tcp.port == 443</button><button data-pfilter=\"tcp.flags.syn == 1\">tcp.flags.syn == 1</button><button data-pfilter=\"ip.addr == 10.10.5.24\">ip.addr == 10.10.5.24</button><button data-pfilter=\"tls\">tls</button><button data-pfilter=\"http\">http</button></div>\n      <div class=\"packet-table-wrap\"><table class=\"table\"><thead><tr><th>№</th><th>Время</th><th>Источник</th><th>Назначение</th><th>Протокол</th><th>Байт</th><th>Информация</th></tr></thead><tbody id=\"packet-rows\"><tr><td colspan=\"7\" class=\"empty-state\">Нажми «Начать учебный захват».</td></tr></tbody></table></div>\n      <div id=\"packet-detail\" class=\"packet-detail\"><h3>Что здесь смотреть?</h3><p>Выбери пакет в таблице, чтобы увидеть его поля и объяснение простыми словами.</p></div>\n    </section>\n    <aside class=\"lab-panel\"><div class=\"lab-panel-head\"><h3>Сводка трафика</h3><span>ЛОКАЛЬНАЯ СИМУЛЯЦИЯ</span></div><div class=\"lab-panel-body\"><div class=\"metric-line\"><span>Пакетов в таблице</span><b id=\"metric-displayed\">0</b></div><div class=\"metric-line\"><span>DNS</span><b id=\"metric-dns\">—</b></div><div class=\"metric-line\"><span>TLS</span><b id=\"metric-tls\">—</b></div><div class=\"metric-line\"><span>SYN без ACK</span><b id=\"metric-syn\">—</b></div><div class=\"metric-line\"><span>Адресов в наборе</span><b id=\"metric-ips\">—</b></div><div class=\"divider\"></div><h3>Как читать фильтр</h3><p style=\"font-size:15px;line-height:1.8;color:var(--muted)\"><code>ip.addr == A</code> показывает пакеты, где адрес A встречается с любой стороны. <code>tcp.port == 443</code> ищет TCP-пакеты с портом 443. Фильтр только скрывает несовпадающие строки — он не удаляет пакеты из учебного набора.</p><div class=\"lesson-note\"><span>i</span><p><b>Не путай корреляцию и доказательство.</b> Один странный пакет ещё не доказывает атаку. Смотри на последовательность, объём, частоту, контекст устройства и события в других источниках.</p></div></div></aside>\n  </div>\n  <section class=\"theory-section\" id=\"connection-theory\"><div class=\"eyebrow\">ВИЗУАЛЬНАЯ СХЕМА</div><h2>Кто с кем общается?</h2><p>Карта ниже показывает связи, которые встретились в учебном трафике. Линия — наблюдавшееся направление связи; толщина зависит от числа пакетов. Нажми на узел, чтобы отфильтровать таблицу по этому IP. Это демонстрационная схема, а не географическая карта и не определение реального человека по адресу.</p>\n    <div class=\"connection-layout\"><div class=\"connection-map\"><svg id=\"connection-svg\" viewBox=\"0 0 800 420\" role=\"img\" aria-label=\"Граф связей между учебными IP-адресами\"><text x=\"400\" y=\"210\" text-anchor=\"middle\" fill=\"#667780\" font-size=\"17\">Запусти захват, чтобы построить схему</text></svg></div><aside class=\"connection-list\"><h3>Наблюдаемые соединения</h3><p>Здесь будут перечислены пары адресов, протоколы и количество увиденных пакетов.</p><div id=\"connection-list\"><div class=\"empty-state\">Пока нет потоков.</div></div></aside></div>\n  </section>\n  <section class=\"theory-section\"><div class=\"eyebrow\">КОНСОЛЬ АНАЛИТИКА</div><h2>Команды для исследования пакетов</h2><p>Это учебная командная строка, похожая по идее на консоль анализатора. Она не является настоящим shell и не исполняет команды операционной системы. Команды только фильтруют и объясняют набор данных на странице.</p>\n    <div class=\"terminal-shell\"><div class=\"terminal-head\"><span class=\"term-dot\"></span><span class=\"term-dot\"></span><span class=\"term-dot\"></span><span>soc-atlas / packet-lab</span><span class=\"terminal-status\" id=\"console-status\">LAB MODE</span></div><div id=\"console-output\" class=\"terminal-output\" aria-live=\"polite\"><div class=\"terminal-line info\">SOC Atlas Packet Console. Напиши help, чтобы увидеть доступные команды.</div></div><form id=\"console-form\" class=\"terminal-input-row\"><label for=\"console-input\">analyst@lab:~$</label><input id=\"console-input\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"help\" aria-label=\"Команда консоли\"></form><div class=\"terminal-suggestions\"><button type=\"button\" data-command=\"help\">help</button><button type=\"button\" data-command=\"capture start\">capture start</button><button type=\"button\" data-command=\"connections\">connections</button><button type=\"button\" data-command=\"ip 10.10.5.24\">ip 10.10.5.24</button><button type=\"button\" data-command=\"trace 198.51.100.77\">trace 198.51.100.77</button><button type=\"button\" data-command=\"filter dns\">filter dns</button><button type=\"button\" data-command=\"block 198.51.100.77\">block 198.51.100.77</button><button type=\"button\" data-command=\"dos demo\">dos demo</button><button type=\"button\" data-command=\"ddos demo\">ddos demo</button><button type=\"button\" data-command=\"clear\">clear</button></div></div>\n    <div class=\"notice\" style=\"margin-top:14px\"><strong>Примеры команд:</strong> <code>ip 10.10.5.24</code> показывает роль адреса в этой лаборатории; <code>whois 198.51.100.77</code> объясняет, что это тестовый адрес из документационного диапазона, а не данные о настоящем владельце; <code>block 198.51.100.77</code> помечает его заблокированным только в текущей симуляции.</div>\n  </section>\n  <section class=\"theory-section\" id=\"dos-ddos\"><div class=\"eyebrow\">ИНТЕРАКТИВНОЕ ОБЪЯСНЕНИЕ</div><h2>DoS и DDoS: что происходит с сервисом?</h2><p><b>DoS</b> — отказ в обслуживании, когда доступность сервиса нарушается из-за исчерпания ресурсов или другого воздействия. <b>DDoS</b> — распределённый вариант: нагрузка приходит с множества источников. Важное отличие — распределение источников, а не просто «большое число пакетов». Симуляция ниже показывает только условную нагрузку и влияние на доступность; реальный трафик не отправляется.</p>\n    <div class=\"traffic-sim\"><h3>Посмотри на разницу</h3><p>Выбери демонстрацию. Шкалы условные, не являются инструкцией по организации атаки и не отражают производительность реального сервера.</p><div class=\"traffic-mode-row\"><button class=\"btn primary\" id=\"dos-start-one\">Показать DoS: один источник</button><button class=\"btn\" id=\"dos-start-many\">Показать DDoS: много источников</button><button class=\"btn\" id=\"dos-reset\">Сбросить</button></div><div id=\"traffic-sources\" class=\"traffic-sources\"><span class=\"endpoint-chip\">Обычные клиенты · 3</span></div><div class=\"traffic-metric\"><span>Обычный трафик</span><div class=\"traffic-track\"><div class=\"traffic-fill\" id=\"traffic-normal-fill\" style=\"width:24%\"></div></div><strong id=\"traffic-normal-value\">24 / 100</strong></div><div class=\"traffic-metric\"><span>Избыточная нагрузка</span><div class=\"traffic-track\"><div class=\"traffic-fill warn\" id=\"traffic-load-fill\" style=\"width:0%\"></div></div><strong id=\"traffic-load-value\">0 / 100</strong></div><div class=\"traffic-metric\"><span>Доступность сервиса</span><div class=\"traffic-track\"><div class=\"traffic-fill\" id=\"traffic-availability-fill\" style=\"width:96%\"></div></div><strong id=\"traffic-availability-value\">96%</strong></div><div class=\"traffic-outcome\" id=\"traffic-outcome\">Пока всё штатно: сервис обслуживает обычные запросы. Запусти одну из демонстраций, чтобы сравнить концепции.</div></div>\n    <div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">01 / DO S</div><h3>Один источник</h3><p>При простой модели DoS избыточная нагрузка идёт от одного источника. В реальности источники могут подменяться или использовать несколько путей, поэтому одного IP недостаточно для диагноза.</p><div class=\"example\">Что проверять: частоту событий, тип ресурса, ошибки сервера, нормальную базовую нагрузку.</div></article><article class=\"concept-card\"><div class=\"concept-num\">02 / DDoS</div><h3>Много источников</h3><p>При DDoS нагрузка распределена между несколькими устройствами или сетями. Блокировка одного адреса может почти ничего не изменить, а часть источников может быть обычными скомпрометированными устройствами.</p><div class=\"example\">Что проверять: всплеск объёма, распределение по адресам/сетям, запросам и протоколам, влияние на легитимных пользователей.</div></article><article class=\"concept-card\"><div class=\"concept-num\">03 / DEFENSE</div><h3>Как защищаются</h3><p>Защита зависит от слоя и типа нагрузки: фильтрация и ограничение скорости, CDN/anti-DDoS провайдер, защита приложения, масштабирование, кэширование и план реагирования.</p><div class=\"example\">Аналитику важно зафиксировать время, масштаб, затронутые сервисы, признаки и эффективность мер по утверждённому плану.</div></article></div>\n  </section>\n  <section class=\"theory-section\"><div class=\"eyebrow\">ТЕОРИЯ С ПРИМЕРАМИ</div><h2>Как читать сетевой пакет — с нуля</h2><p>Пакет — это часть данных, передаваемая по сети. В анализаторе он показан как набор вложенных заголовков. Каждый уровень отвечает на свой вопрос: по какой локальной сети передали кадр, между какими IP-узлами идёт обмен, какой транспортный протокол используется и какое приложение общается.</p><div class=\"packet-anatomy\"><div><b>Ethernet</b><span>Связь внутри локального канала: MAC-адреса соседних сетевых устройств.</span></div><div><b>IP</b><span>Логический источник и назначение пакета между сетями.</span></div><div><b>TCP / UDP</b><span>Доставка данных между программами через порты.</span></div><div><b>TLS / HTTP / DNS</b><span>Протокол прикладного уровня, если его можно определить.</span></div><div><b>Payload</b><span>Содержимое. При HTTPS полезные данные обычно зашифрованы.</span></div></div>\n    <div class=\"concept-grid\"><article class=\"concept-card\"><div class=\"concept-num\">ПОНЯТИЕ 01</div><h3>IP и порт — разные вещи</h3><p>IP-адрес указывает на сетевой интерфейс или узел в контексте сети. Порт помогает операционной системе направить данные конкретной службе. Один узел может одновременно обслуживать HTTPS, DNS и другие сервисы.</p><div class=\"example\">Пример: 10.10.5.24:53023 → 10.10.5.80:443. Источник использует временный порт 53023, сервер принимает TCP-соединение на 443.</div></article><article class=\"concept-card\"><div class=\"concept-num\">ПОНЯТИЕ 02</div><h3>TCP и UDP</h3><p>TCP устанавливает логическое соединение, нумерует байты и повторно передаёт потерянные данные. UDP не устанавливает такую сессию и имеет меньшие накладные расходы; порядок и повторная доставка обеспечиваются приложением, если нужны.</p><div class=\"example\">Не делай вывод по одному порту: DNS часто использует UDP/53, HTTPS — обычно TCP/443 либо QUIC поверх UDP/443.</div></article><article class=\"concept-card\"><div class=\"concept-num\">ПОНЯТИЕ 03</div><h3>DNS — имя в адрес</h3><p>DNS позволяет приложениям находить IP-адреса и другие сведения по доменному имени. Запрос и ответ могут показать, к какому имени обращалось устройство, но сам по себе запрос не означает угрозу.</p><div class=\"example\">Ищи необычные домены, редкие запросы, ошибки ответа и большое количество запросов; сравнивай с обычным поведением устройства.</div></article></div>\n    <h2 style=\"margin-top:35px\">TCP handshake — как начинается соединение</h2><p>Для стандартного установления TCP-соединения стороны обмениваются тремя сообщениями. Это не «три отдельных соединения», а шаги согласования состояния одного соединения.</p><div class=\"flow-demo\"><div class=\"flowbox\"><b>1. SYN →</b><span>Клиент просит начать соединение и сообщает начальный номер последовательности.</span></div><div class=\"flowbox\"><b>2. ← SYN, ACK</b><span>Сервер подтверждает запрос и предлагает свою начальную последовательность.</span></div><div class=\"flowbox\"><b>3. ACK →</b><span>Клиент подтверждает ответ; после этого соединение обычно готово к передаче данных.</span></div></div><div class=\"notice\"><strong>Практический смысл:</strong> большое число SYN без соответствующих завершённых рукопожатий может быть поводом для проверки, но возможны и сетевые потери, сканирование, асимметричная маршрутизация или неполный захват. Нужны временной контекст и другие признаки.</div>\n    <h2 style=\"margin-top:35px\">Что шифрование меняет для аналитика?</h2><p>При обычном HTTP в захвате могут быть видны содержимое запросов и ответы. HTTPS использует TLS для защиты содержимого. Даже при шифровании могут остаться метаданные: IP-адреса, порты, время, размеры пакетов и часть сведений об установлении соединения. Поэтому анализатор помогает понять структуру коммуникации, но обычно не раскрывает секретное содержимое HTTPS без предусмотренного и разрешённого доступа к расшифрованным данным.</p>\n  </section>\n  <section class=\"theory-section\"><div class=\"eyebrow\">СПРАВОЧНИК И ПЕРВОИСТОЧНИКИ</div><h2>Что изучить дальше</h2><p>Симулятор поддерживает только небольшой набор выражений для обучения. Настоящий Wireshark имеет значительно больше полей и фильтров — команды ниже приведены как отправная точка, а полная грамматика доступна в официальной документации.</p><div class=\"grid two\"><article class=\"card\"><h3>Фильтры для старта</h3><p><code>dns</code> — DNS-пакеты.<br><code>tcp.port == 443</code> — TCP с портом 443.<br><code>ip.addr == 10.10.5.24</code> — пакеты с указанным адресом.<br><code>tcp.flags.syn == 1</code> — TCP-пакеты с SYN-флагом.</p><p>В настоящем Wireshark синтаксис фильтра отображения отличается от фильтра захвата; документация объясняет различия и доступные поля.</p><a class=\"btn\" href=\"https://www.wireshark.org/docs/man-pages/wireshark-filter.html\" target=\"_blank\" rel=\"noreferrer\">Официальный справочник фильтров ↗</a></article><article class=\"card\"><h3>DoS/DDoS: защита и реагирование</h3><p>При подозрении на отказ в обслуживании сначала оценивают доступность сервиса, время начала, масштабы и затронутые компоненты; затем проверяют сетевые и прикладные метрики и действуют по утверждённому плану реакции.</p><p>Памятка CISA совместно с FBI и MS-ISAC описывает меры подготовки и реагирования на DDoS.</p><a class=\"btn\" href=\"https://www.cisa.gov/sites/default/files/publications/understanding-and-responding-to-ddos-attacks_508c.pdf\" target=\"_blank\" rel=\"noreferrer\">Руководство CISA ↗</a><a class=\"btn\" href=\"https://developers.cloudflare.com/learning-paths/prevent-ddos-attacks/concepts/ddos-attacks/\" target=\"_blank\" rel=\"noreferrer\" style=\"margin-top:8px\">Простое объяснение DDoS ↗</a></article></div></section>\n</main><footer class=\"footer\"><div class=\"wrap footer-inner\"><div><strong>SOC ATLAS</strong> · учебная площадка для аналитика безопасности</div><div>Только синтетический трафик · симуляция не отправляет пакеты</div></div></footer><script>\n(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const store={get(k,d=null){try{let x=localStorage.getItem('socatlas:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('socatlas:'+k,JSON.stringify(v))}catch{}}};window.SOC={$, $$,store,toast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)},mark(id,done){let a=store.get('completed',[]);a=done?[...new Set([...a,id])]:a.filter(x=>x!==id);store.set('completed',a);document.dispatchEvent(new CustomEvent('soc:progress'))},completed(){return store.get('completed',[])},esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}};let page=document.body.dataset.page||'';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===page+'.html')a.classList.add('active')});let t=$('.mobile-toggle'),n=$('.nav');if(t&&n)t.onclick=()=>n.classList.toggle('open');if('IntersectionObserver'in window){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(e=>o.observe(e))}else $$('.reveal').forEach(e=>e.classList.add('visible'));function progress(){let done=SOC.completed(),all=new Set($$('[data-progress-id]').map(e=>e.dataset.progressId)),count=[...all].filter(x=>done.includes(x)).length,total=all.size||69,globalCount=done.length,pct=Math.min(100,Math.round(globalCount/total*100));$$('[data-progress-id]').forEach(e=>{if(e.type==='checkbox')e.checked=done.includes(e.dataset.progressId)});$$('[data-progress-count]').forEach(e=>e.textContent=(all.size?count:Math.min(globalCount,total))+'/'+total);$$('[data-progress-percent]').forEach(e=>e.textContent=pct+'%');$$('[data-progress-fill]').forEach(e=>e.style.width=pct+'%')}document.addEventListener('change',e=>{let el=e.target.closest('[data-progress-id]');if(el&&el.type==='checkbox')SOC.mark(el.dataset.progressId,el.checked)});document.addEventListener('soc:progress',progress);progress();let clock=$('[data-clock]');if(clock){const update=()=>clock.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});update();setInterval(update,1000)}})();\n\n// Guided tour across all learning pages. All content is client-side; no account is required.\n(()=>{\n  const {$,store}=window.SOC;\n  const steps=[\n    {page:'index.html',selector:'.hero h1',title:'Добро пожаловать в SOC Atlas',text:'Это учебная среда для пути к первой роли SOC Analyst. Экскурсия проведёт тебя по карте навыков, теории, инструментам и учебным расследованиям.'},\n    {page:'index.html',selector:'.hero-panel',title:'Как выглядит смена SOC',text:'Здесь показана синтетическая телеметрия: события, сигналы и уровни серьёзности. В реальной работе аналитик проверяет не только сам алерт, но и контекст вокруг него.'},\n    {page:'index.html',selector:'.stats-row',title:'Прогресс обучения',text:'Выполненные пункты сохраняются в этом браузере. Процент — ориентир по отмеченным темам, а не автоматическое подтверждение практического навыка.'},\n    {page:'roadmap.html',selector:'.content-layout',title:'Карта навыков',text:'Двигайся по зависимостям: основы сетей и ОС → логи и SIEM → триаж и расследования → портфолио и трудоустройство. Не перескакивай через фундамент.'},\n    {page:'roadmap.html',selector:'#curriculum',title:'Каждый этап объяснён',text:'Раскрывай модули, отмечай темы и выполняй практику. Переходи дальше, когда можешь объяснить тему своими словами и выполнить задание без пошаговой подсказки.'},\n    {page:'academy.html',selector:'.content-layout',title:'Мышление аналитика',text:'Отделяй наблюдаемые факты от гипотез. Записывай, что известно, чего не хватает, что проверил и почему выбрал конкретное решение.'},\n    {page:'tools.html',selector:'.tool-grid',title:'Интерактивные инструменты',text:'Здесь собраны учебные аналоги инструментов: анализ пакетов, Mini SIEM, endpoint timeline, анализ фишинга, конструктор детекций и разбор инцидента.'},\n    {page:'lab-wireshark.html',selector:'.lab-layout',title:'Packet Explorer',text:'Выбирай пакет, применяй фильтр и раскрывай уровни протокола. Это синтетическая трасса для обучения, не настоящий захват сетевого трафика и не полноценный парсер PCAP.'},\n    {page:'siem.html',selector:'#siem-query',title:'Mini SIEM',text:'Ищи события по полям, фильтруй по категории и серьёзности, открывай детали. Учись связывать время, пользователя, источник, действие и результат.'},\n    {page:'endpoint.html',selector:'.lab-layout',title:'Endpoint-телеметрия',text:'Таймлайн помогает увидеть последовательность событий на конечном устройстве: процессы, учётные записи и подозрительную активность. Важно восстановить цепочку, а не судить по одному событию.'},\n    {page:'phishing.html',selector:'.mail-layout',title:'Проверка фишинга',text:'Ищи несоответствия доменов, срочность, подозрительные ссылки и странные запросы. Один признак не всегда доказывает фишинг — оценивай комбинацию сигналов и контекст.'},\n    {page:'cases.html',selector:'.content-layout',title:'Комната расследований',text:'Собери доказательства, оцени серьёзность, выбери следующий шаг и подготовь передачу старшему аналитику. Хороший handoff позволяет другому человеку продолжить работу без догадок.'},\n    {page:'detection.html',selector:'.lab-layout',title:'От расследования к детекции',text:'Проверяй правило на учебных событиях и думай о пороге, временном окне, false positives и пропущенных случаях. Результат на маленьком наборе данных не доказывает эффективность в боевой среде.'},\n    {page:'interview.html',selector:'.quiz-box',title:'Проверка готовности',text:'Тест и идеи проектов помогут найти пробелы. Для первой работы важнее уверенная практика, умение объяснить ход расследования, аккуратные заметки и базовые навыки, чем число пройденных курсов.'},\n    {page:'index.html',selector:'.feature-band',title:'Теперь твой маршрут',text:'Начни с карты навыков, выполняй лабораторные задания и сохраняй результаты в портфолио. Демо безопасны и используют фиксированные синтетические данные.'}\n  ];\n  const key='guidedTour';let focus=null,dialog=null,resizeHandler=null;\n  function pageName(){return ((document.body.dataset.page||'index')+'.html').toLowerCase()}\n  function remove(){if(focus)focus.remove();if(dialog)dialog.remove();focus=null;dialog=null;if(resizeHandler)window.removeEventListener('resize',resizeHandler);document.querySelectorAll('[data-tour-active]').forEach(e=>e.removeAttribute('data-tour-active'))}\n  function end(){remove();store.set(key,null);}\n  function show(index){\n    remove(); if(index<0||index>=steps.length){end();return}\n    store.set(key,index); const step=steps[index];\n    if(pageName()!==step.page){parent.postMessage({type:'soc-atlas-route',page:step.page.replace(/\\.html$/i,''),hash:'',tourIndex:index},'*');return}\n    let target=$(step.selector);\n    if(!target){let next=index+1;show(next);return}\n    target.scrollIntoView({behavior:'smooth',block:'center'});target.setAttribute('data-tour-active','');\n    focus=document.createElement('div');focus.className='tour-focus';focus.setAttribute('aria-hidden','true');document.body.appendChild(focus);\n    dialog=document.createElement('section');dialog.className='tour-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Экскурсия по сайту');\n    dialog.innerHTML=`<div class=\"tour-kicker\">SOC ATLAS · GUIDED TOUR</div><h3>${step.title}</h3><p>${step.text}</p><div class=\"tour-actions\"><div class=\"left\"><button class=\"tour-dismiss\" data-tour-close>Завершить</button></div><span class=\"tour-counter\">${String(index+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><div class=\"right\">${index?'<button class=\"btn small ghost\" data-tour-prev>← Назад</button>':''}<button class=\"btn small primary\" data-tour-next>${index===steps.length-1?'Завершить':'Далее →'}</button></div></div>`;\n    document.body.appendChild(dialog);\n    function position(){let r=target.getBoundingClientRect(),pad=5;focus.style.left=Math.max(5,r.left-pad)+'px';focus.style.top=Math.max(5,r.top-pad)+'px';focus.style.width=Math.min(window.innerWidth-10,r.width+pad*2)+'px';focus.style.height=Math.min(window.innerHeight-10,r.height+pad*2)+'px'}\n    position();resizeHandler=pos UDP datagram · training time service',summary:'Условная UDP-датаграмма в документационный диапазон. UDP не обещает доставку и порядок сам по себе.',suspicious:false}\n];\n\n<\/script><script>\n(()=>{\n const {$,$$,esc,toast}=SOC;\n const $rows=$('#packet-rows'),$filter=$('#packet-filter'),$detail=$('#packet-detail');\n if(!$rows||!window.SOC_PACKET_TEMPLATES)return;\n const templates=window.SOC_PACKET_TEMPLATES;\n const roles={\n  '10.10.5.24':{name:'Рабочая станция WS-24',role:'Учебный клиент пользователя',zone:'Внутренняя сеть лаборатории'},\n  '10.10.5.31':{name:'Рабочая станция WS-31',role:'Второй учебный клиент',zone:'Внутренняя сеть лаборатории'},\n  '10.10.5.42':{name:'Рабочая станция WS-42',role:'Третий учебный клиент',zone:'Внутренняя сеть лаборатории'},\n  '10.10.5.1':{name:'DNS-RESOLVER-01',role:'Учебный DNS-резолвер',zone:'Внутренняя сеть лаборатории'},\n  '10.10.5.80':{name:'WEB-TRAINING-01',role:'Учебный веб-сервер',zone:'Внутренняя сеть лаборатории'},\n  '10.10.5.99':{name:'CLIENT-TEST-99',role:'Условный источник аномального поведения',zone:'Внутренняя сеть лаборатории'},\n  '198.51.100.77':{name:'TEST-NET-2 endpoint',role:'Условный внешний узел в сценарии',zone:'Документационный IPv4-диапазон'},\n  '203.0.113.15':{name:'TEST-NET-3 endpoint',role:'Демонстрационный адрес из документационного диапазона',zone:'Документационный IPv4-диапазон'},\n  '192.0.2.44':{name:'TEST-NET-1 endpoint',role:'Демонстрационный адрес из документационного диапазона',zone:'Документационный IPv4-диапазон'}\n };\n let packets=[],selectedNo=null,captured=false,timer=null,nextNo=1,blockedIps=new Set(),lastAdded=null,seconds=0,scenarioIndex=0;\n const ipPool=['10.10.5.24','10.10.5.31','10.10.5.42','10.10.5.99'];\n const extPool=['198.51.100.77','203.0.113.15','192.0.2.44'];\n const pad=n=>String(n).padStart(2,'0');\n const safe=(s)=>esc(String(s??''));\n function formatTime(n){return (n/1000).toFixed(3).padStart(7,'0')}\n function makeLayers(p){\n  const ip=`Source: ${p.src}\\nDe time=formatTime(when);p.blocked=blockedIps.has(p.src)||blockedIps.has(p.dst);p.when=when;\n  p.layers=makeLayers(p);return p;\n }\n function generatedPacket(){\n  scenarioIndex++;\n  let t=templates[(scenarioIndex-1)%templates.length];\n  // Change client and documentation-range endpoints to teach that each frame has its own endpoints.\n  let c=ipPool[(scenarioIndex-1)%ipPool.length], ext=extPool[(Math.floor((scenarioIndex-1)/3))%extPool.length];\n  t=JSON.parse(JSON.stringify(t));\n  if(['dns','syn','tls','tls-data','ack'].includes(t.kind))t.src=c;\n  if(t.kind==='dns' )t.dst='10.10.5.1';\n  if(t.kind==='dns-answer'){t.src='10.10.5.1';t.dst=ipPool[(scenarioIndex-1)%ipPool.length]}\n  if(['syn','synack','ack','tls','tls-data'].includes(t.kind)){t.src=t.kind==='synack'?'10.10.5.80':c;t.dst=t.kind==='synack'?c:(scenarioIndex%4===0?ext:'10.10.5.80');if(t.kind==='syn'||t.kind==='ack'||t.kind==='tls'||t.kind==='tls-data')t.suspicious=(t.dst===ext&&t.kind==='syn')||false;}\n  if(t.kind==='http'){t.src=c;t.dst='10.10.5.80'}\n  if(t.kind==='udp'){t.src=c;t.dst=ext}\n  if(t.kind==='dns-answer'&&t.dst===c)t.info='Standard query response A '+ext;\n  if(t.kind==='syn'&&t.suspicious)t.info=`${t.sport} → ${t.dport} [SYN] · repeated synthetic attempt`;\n  if(t.dst==='198.51.100.77'||t.src==='198.51.100.77')t.suspicious=true;\n  const p=createPacket(t,seconds);seconds+=Math.floor(18+Math.random()*160);return p;\n }\n function addInitial(){\n  packets=[];nextNo=1;seconds=0;scenarioIndex=0;\n  for(let i=0;i<12;i++){packets.push(generatedPacket())}\n  lastAdded=packets[packets.length-1].no;\n }\n function matches(p,raw){\n  let f=raw.trim().toLowerCase();if(!f)return true;\n  if(f==='dns')return p.proto.toLowerCase()==='dns';\n  if(f==='http')return p.proto.toLowerCase()==='http';\n  if(f==='tls')return p.proto.toLowerCase()==='tls';\n  if(f==='tcp')return p.proto.toLowerCase()==='tcp';\n  if(f==='udp')return p.proto.toLowerCase()==='udp';\n  if(f.includes('tcp.port')&&f.includes('443 .proto==='DNS'?'badge-warn':p.proto==='TLS'?'badge-ok':'badge-info'}\">${safe(p.proto)}</span></td><td class=\"mono-cell\">${p.len}</td><td>${safe(p.info)}${p.blocked?' <b class=\"text-red\">[LAB BLOCK]</b>':''}</td></tr>`).join('');\n  renderDetail(visible.find(p=>p.no===selectedNo));renderGraph();\n }\n function renderDetail(p){\n  if(!p){$detail.innerHTML='<div class=\"empty-state\">Выбери пакет.</div>';return}\n  let note=p.summary;\n  let flags=p.flags?`<span class=\"endpoint-chip\">TCP ${p.flags.toUpperCase()}</span>`:'';\n  $detail.innerHTML=`<div style=\"display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:13px\"><strong style=\"font-size:16px\">Frame ${p.no} · ${safe(p.proto)}</strong><span class=\"pill\">${p.len} байт · ${safe(p.time)} s</span></div><div class=\"endpoint-chip\">${safe(p.src)}:${p.sport}</div><span>→</span><div class=\"endpoint-chip\">${safe(p.dst)}:${p.dport}</div>${flags}<div class=\"divider\"></div>${p.layers.map((l,i)=>`<details class=\"packet-layer\" ${i===0?'open':''}><summary>${safe(l[0])}</summary><div class=\"layer-body\">${safe(l[1]).replace(/\\n/g,'<br>')}</div></details>`).join('')}<div class=\"lesson-note\"><span>i</span><p><b>Что это значит:</b> ${safe(note)}${p.blocked?' Адрес помечен заблокированным в этой симуляции; реальная система не затронута.':''}</p></div><div class=\"decision-row\"><button class=\"btn small\" data-ipinspect=\"${safe(p.src)}\">Исследовать источник</button><button class=\"btn small\" data-ipinspect=\"${safe(p.dst)}\">Исследовать назначение</button><button class=\"btn small\" data-trace=\"${safe(p.src)}\">История адреса</button></div>`;\n }\n function ipDescription(ip){return roles[ip]||{name:'Адрес не включён в учебный набор',role:'Симулятор не выполняет live WHOIS или внешнюю атрибуцию',zone:'Неизвестно в рамках этого набора'};}\n function renderGraph(){\n  const svg=$('#connection-svg'),list=$('#connection-list');if(!svg||!list)return;\n  const known=Object.keys(roles),current=packets;\n  const countMap=new Map();current.forEach(p=>{let key=p.src+'|'+p.dst;let v=countMap.get(key)||{src:p.src,dst:p.dst,count:0,proto:new Set(),alert:false};v.count++;v.proto.add(p.proto);v.alert=v.alert||p.suspicious;countMap.set(key,v)});\n  const edges=[...countMap.values()].sort((a,b)=>b.count-a.count).slice(0,14);\n  if(!edges.length){svg.innerHTML='<text x=\"400\" y=\"210\" text-anchor=\"middle\" fill=\"#667780\" font-size=\"17\">Запусти захват, чтобы построить схему</text>';list.innerHTML='<div class=\"empty-state\">Пока нет потоков.</div>';return}\n  const activeIps=new Set(edges.flatMap(e=>[e.src,e.dst]));\n  const coords={'10.10.5.24':[120,82],'10.10.5.31':[120,210],'10.10.5.42':[120,338],'10.10.5.99':[400,348],'10.10.5.1':[395,72],'10.10.5.80':[410,205],'198.51.100.77':[680,85],'203.0.113.15':[680,208],'192.0.2.44':[680,337]};\n  let svgHtml='<defs><marker id=\"arrowhead\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"#81929b\"/></marker></defs>';\n  edges.forEach(e=>{if(!coords[e.src]||!coords[e.dst])return;let [x1,y1]=coords[e.src],[x2,y2]=coords[e.dst];svgHtml+=`<line class=\"edge ${e.alert?'alert':''}\" x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke-width=\"${Math.min(4,1+e.count*.35)}\" marker-end=\"url(#arrowhead)\" opacity=\".8\"><title>${safe(e.src)} → ${safe(e.dst)} · ${e.count} пакетов</title></line>`});\n  activeIps.forEach(ip=>{let pos=coords[ip];if(!pos)return;let [x,y]=pos,meta=ipDescription(ip),cl=ip.startsWith('198.')||ip.startsWith('203.')||ip.startsWith('192.')?'external':ip==='10.10.5.80'||ip==='10.10.5.1'?'server':'';svgHtml+=`<g class=\"node ${cl}\" data-ip=\"${ip}\" tabindex=\"0\" role=\"button\" aria-label=\"Фильтр по ${ip}\"><circle cx=\"${x}\" cy=\"${y}\" r=\"26\"></circle><text x=\"${x}\" y=\"${y+4}\">IP</text><text class=\"node-name\" x=\"${x}\" y=\"${y+45}\">${ip}</text><title>${safe(meta.name)} — нажми, чтобы фильтровать</title></g>`});\n  svg.innerHTML=svgHtml;\n  list.innerHTML=edges.slice(0,8).map(e=>`<div class=\"conn-item\"><button type=\"button\" data-conn-ip=\"${safe(e.src)}\">${safe(e.src)} → ${safe(e.dst)}</button><small>${e.count} пак. · ${[...e.proto].join(', ')}${e.alert?' · сценарий для проверки':''}</small></div>`).join('');\n }\n function commandPrint(text,cls=''){const out=$('#console-output');if(!out)return;const line=document.createElement('div');line.className='terminal-line '+cls;line.textContent=text;out.appendChild(line);while(out.children.length>80)out.removeChild(out.firstChild);out.scrollTop=out.scrollHeight;}\n function commandEcho(cmd){commandPrint('analyst@lab:~$ '+cmd,'info')}\n function startCapture(){if(captured&&timer)return;captured=true;$('#capture-status').textContent='ЗАХВАТ ИДЁТ · DEMO';$('#capture-led').classList.add('running');$('#capture-start').disabled=true;$('#capture-stop').disabled=false;$('#capture-start').textContent='▶ Захват идёт';if(!packets.length)addInitial();render();if(!timer)timer=setInterval(()=>{if(!captured)return;const p=generatedPacket();p.blocked=blockedIps.has(p.src)||blockedIps.has(p.dst);packets.push(p);if(packets.length>140)packets.shift();lastAdded=p.no;if(!selectedNo)selectedNo=p.no;render()},1200);}\n function stopCapture(){captured=false;if(timer){clearInterval(timer);timer=null}$('#capture-status').textContent='ПАУЗА';$('#capture-led').classList.remove('running');$('#capture-start').disabled=false;$('#capture-start').textContent='▶ Продолжить';$('#capture-stop').disabled=true;}\n function resetCapture(){stopCapture();packets=[];nextNo=1;seconds=0;scenarioIndex=0;selectedNo=null;lastAdded=null;blockedIps.clear();$filter.value='';$('#capture-status').textContent='ГОТОВ К ЗАПУСКУ';$('#capture-start').textContent='▶ Начать учебный захват';$('#console-status').textContent='LAB MODE';render();}\n function filterBy(value){$filter.value=value;render()}\n function whois(ip){let known=roles[ip];if(known)return `${ip}\\nНазвание в учебном стенде: ${known.name}\\nРоль: ${known.role}\\nЗона: ${known.zone}\\nПримечание: это метка синтетического сценария, не атрибуция реального владельца.`;if(/^(192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.)/.test(ip))return `${ip} входит в документационные диапазоны TEST-NET. В реальной сети это не информация о владельце; здесь внешнее обращение не выполняется.`;return `Для ${ip} данных в синтетическом наборе нет. Эта лаборатория не отправляет WHOIS/DNS-запросы и не определяет владельца произвольного IP.`}\n function traceIp(ip){const found=packets.filter(p=>p.src===ip||p.dst===ip).slice(-12);if(!found.length)return `Адрес ${ip} не встречался в текущем захвате. Запусти захват или попробуй другой IP.`;return `Последние события для ${ip}:\\n`+found.map(p=>`#${p.no} ${p.time}s ${p.src} → ${p.dst} · ${p.proto} · ${p.info}`).join('\\n')}\n function startTrafficDemo(mode){\n  const many=mode==='ddos';const sources=many?['198.51.100.20','198.51.100.21','203.0.113.31','203.0.113.32','192.0.2.40','192.0.2.41','198.51.100.77']:['198.51.100.77'];\n  $('#traffic-sources').innerHTML=sources.map(ip=>`<span class=\"traffic-source\">${ip} · DEMO</span>`).join('');\n  const load=many?94:73,avail=many?7:24;\n  $('#traffic-load-fill').style.width=load+'%';$('#traffic-load-value').textContent=load+' / 100';$('#traffic-availability-fill').style.width=avail+'%';$('#traffic-availability-value').textContent=avail+'%';$('#traffic-normal-fill').style.width='24%';$('#traffic-normal-value').textContent='24 / 100';\n  $('#traffic-outcome').textContent=many?'DDoS (учебная модель): нагрузка распределена по множеству источников. Обычные запросы конкурируют за общие ресурсы, поэтому доступность падает. В реальной реакции нужны наблюдение за несколькими метриками и защита на подходящем уровне. Ни один пакет в интернет не отправлен.':'DoS (учебная модель): один источник создаёт избыточную нагрузку на условный сервис. Если ресурс ограничен, нормальным пользователям становится труднее получить ответ. В реальности проверяют, какой ресурс исчерпан и совпадает ли всплеск с бизнес-событиями. Ни один пакет в интернет не отправлен.';\n }\n function command(cmd){let c=cmd.trim();if(!c)return;commandEcho(c);let parts=c.split(/\\s+/),verb=parts[0].toLowerCase(),arg=parts.slice(1).join(' '),out='';\n  if(c.toLowerCase()==='clear'){$('#console-output').innerHTML='';return}\n  if(c.toLowerCase()==='help'){out='Доступные команды:\\nhelp                         справка\\ncapture start | stop | list  управление учебным потоком\\nfilter <expression>          применить фильтр к таблице\\nconnections                  показать пары узлов\\nip <IPv4>                    сведения об узле стенда\\nwhois <IPv4>                 учебная справка, без внешнего запроса\\ntrace <IPv4>                 история пакетов с адресом\\nblock <IPv4>                 пометить синтетический IP в песочнице\\nstats                        сводка набора\\ndos demo | ddos demo          безопасная анимация концепции\\nclear                        очистить историю консоли\\n';commandPrint(out,'success');return}\n  if(verb==='capture'){\n   if(arg==='start'){startCapture();commandPrint('Учебный поток запущен. Генератор использует только предопределённые демонстрационные адреса.','success')}\n   else if(arg==='stop'){stopCapture();commandPrint('Учебный захват поставлен на паузу.','success')}\n   else if(arg==='list'){commandPrint(packets.length?packets.slice(-12).map(p=>`#${p.no} ${p.src} → ${p.dst} ${p.proto} ${p.info}`).join('\\n'):'Захват пуст. Используй capture start.','info')}\n   else commandPrint('Формат: capture start | capture stop | capture list','error');return;\n  }\n  if(verb==='filter'){if(!arg||arg==='clear'){filterBy('');commandPrint('Фильтр очищен.','success')}else{filterBy(arg);commandPrint(`Применён учебный фильтр: ${arg}. Совпадений: ${activePackets().length}.`,`success`)}return}\n  if(verb==='connections'){const sum=[...new Set(packets.map(p=>p.src+' → '+p.dst))];commandPrint(sum.length?sum.slice(0,25).join('\\n'):'Нет соединений. Запусти capture start.','info');$('#connection-theory').scrollIntoView({behavior:'smooth',block:'start'});return}\n  if(verb==='ip'||verb==='whois'){\n   if(!/^\\d{1,3}(?:\\.\\d{1,3}){3}$/.test(arg)){commandPrint('Укажи IPv4, например: ip 10.10.5.24','error');return}\n   const ip=arg;commandPrint(verb==='whois'?whois(ip):`${ip}\\n${whois(ip)}\\nПакетов с этим адресом: ${packets.filter(p=>p.src===ip||p.dst===ip).length}\\nПротоколы: ${[...new Set(packets.filter(p=>p.src===ip||p.dst===ip).map(p=>p.proto))].join(', ')||'пока нет наблюдений'}\\nПроверка: смотри направление, повторы и временные интервалы.`,'info');return;\n  }\n  if(verb==='trace') {if(!arg){commandPrint('Формат: trace 198.51.100.77','error');return}commandPrint(traceIp(arg),'info');return;}\n  if(verb==='block'){\n   if(!/^\\d{1,3}(?:\\.\\d{1,3}){3}$/.test(arg)){commandPrint('Формат: block <IP из учебного набора>.','error');return}\n   const known=packets.some(p=>p.src===arg||p.dst===arg)||roles[arg];if(!known){commandPrint('Адрес не встречается в учебном наборе. Для безопасности стенд не имитирует блокировку произвольного IP.','error');return;}\n   blockedIps.add(arg);packets.forEach(p=>{if(p.src===arg||p.dst===arg)p.blocked=true});render();commandPrint(`LAB ONLY: ${arg} отмечен как заблокированный в этой симуляции. Настройки ОС, роутера и реальной сети не менялись.`,'success');return;\n  }\n  if(verb==='stats'){const ips=new Set(packets.flatMap(p=>[p.src,p.dst]));commandPrint(`Пакетов: ${packets.length}\\nУникальных IP в учебном наборе: ${ips.size}\\nDNS: ${packets.filter(p=>p.proto==='DNS').length}\\nTLS: ${packets.filter(p=>p.proto==='TLS').length}\\nSYN без ACK: ${packets.filter(p=>p.flags==='syn').length}\\nПомеченные в симуляции blocked: ${blockedIps.size}`,'info');return;}\n  if(verb==='dos'&&arg==='demo'){startTrafficDemo('dos');commandPrint('Запущена только визуальная модель DoS. Сетевые пакеты не отправлялись.','success');$('#dos-ddos').scrollIntoView({behavior:'smooth',block:'start'});return;}\n  if(verb==='ddos'&&arg==='demo'){startTrafficDemo('ddos');commandPrint('Запущена только визуальная модель DDoS. Сетевые пакеты не отправлялись.','success');$('#dos-ddos').scrollIntoView({behavior:'smooth',block:'start'});return;}\n  if(verb==='explain'){const explanation={ip:'IP отвечает на вопрос: какие сетевые адреса указаны в заголовке пакета.',tcp:'TCP обеспечивает упорядоченный поток байтов, подтверждения и повторную передачу.',udp:'UDP передаёт отдельные датаграммы; доставка и порядок не гарантируются транспортным протоколом.',dns:'DNS помогает сопоставить доменные имена с IP-адресами и другими записями.',tls:'TLS шифрует канал между сторонами и защищает конфиденциальность содержимого при корректной настройке.',http:'HTTP описывает запросы и ответы веб-приложения; без TLS содержимое может быть доступно наблюдателю пути.'};commandPrint(explanation[arg.toLowerCase()]||'Попробуй explain ip, explain tcp, explain udp, explain dns, explain tls или explain http.','info');return;}\n  commandPrint('Неизвестная команда. Введи help.','error');\n }\n $('#capture-start').addEventListener('click',startCapture);$('#capture-stop').addEventListener('click',stopCapture);$('#capture-reset').addEventListener('click',resetCapture);\n $('#filter-apply').addEventListener('click',render);$('#filter-clear').addEventListener('click',()=>filterBy(''));$filter.addEventListener('keydown',e=>{if(e.key==='Enter')render()});\n $$('[data-pfilter]').forEach(b=>b.addEventListener('click',()=>filterBy(b.dataset.pfilter)));\n $rows.addEventListener('click',e=>{const tr=e.target.closest('[data-no]');if(tr){selectedNo=Number(tr.dataset.no);render()}});\n $detail.addEventListener('click',e=>{let ipBtn=e.target.closest('[data-ipinspect]');let traceBtn=e.target.closest('[data-trace]');if(ipBtn){$('#console-input').value='ip '+ipBtn.dataset.ipinspect;command($('#console-input').value);$('#console-input').value='';$('#console-input').focus()}if(traceBtn){$('#console-input').value='trace '+traceBtn.dataset.trace;command($('#console-input').value);$('#console-input').value='';$('#console-input').focus()}});\n $('#connection-svg').addEventListener('click',e=>{const n=e.target.closest('[data-ip]');if(n){filterBy('ip.addr == '+n.dataset.ip);$('#packet-filter').scrollIntoView({behavior:'smooth',block:'center'})}});\n $('#connection-svg').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-ip]');if(n){e.preventDefault();filterBy('ip.addr == '+n.dataset.ip)}}});\n $('#connection-list').addEventListener('click',e=>{const b=e.target.closest('[data-conn-ip]');if(b)filterBy('ip.addr == '+b.dataset.connIp)});\n $('#console-form').addEventListener('submit',e=>{e.preventDefault();const input=$('#console-input');const c=input.value;input.value='';command(c)});\n $$('.terminal-suggestions [data-command]').forEach(b=>b.addEventListener('click',()=>command(b.dataset.command)));\n $('#dos-start-one').addEventListener('click',()=>startTrafficDemo('dos'));$('#dos-start-many').addEventListener('click',()=>startTrafficDemo('ddos'));$('#dos-reset').addEventListener('click',()=>{$('#traffic-sources').innerHTML='<span class=\"endpoint-chip\">Обычные клиенты · 3</span>';$('#traffic-load-fill').style.width='0%';$('#traffic-load-value').textContent='0 / 100';$('#traffic-availability-fill').style.width='96%';$('#traffic-availability-value').textContent='96%';$('#traffic-outcome').textContent='Пока всё штатно: сервис обслуживает обычные запросы. Запусти одну из демонстраций, чтобы сравнить концепции.'});\n document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer)stopCapture()});\n render();\n})();\n\n<\/script><script>\n(()=>{\n const allowed=new Set(['index','roadmap','academy','tools','lab-wireshark','siem','cases','detection','endpoint','phishing','interview']);\n document.addEventListener('click',ev=>{\n   const a=ev.target.closest('a[href]'); if(!a||ev.defaultPreve
